# emulation extension : uninstall playbook
# Reverse of install.yml, best-effort per host: removes everything the
# extension PUT ON THE ENDPOINTS and the extension's own state.
#
# Run it from extensions/emulation/ansible (so ansible.cfg applies) with the
# same inventories goad's run_extension() passes to install.yml:
#
#   cd extensions/emulation/ansible
#   ansible-playbook \
#     -i ../../../ad/<lab>/data/inventory \
#     -i ../../../workspace/<instance_id>/inventory \
#     -i ../../../workspace/<instance_id>/emulation_inventory \
#     -i ../../../globalsettings.ini \
#     uninstall.yml
#
# (add -i ../../../workspace/<instance_id>/<ext>_inventory for every other
# enabled extension, like run_extension does)
#
# The plays have no roles, so the role defaults are loaded with vars_files
# (paths, versions, service names stay in one place).
#
# (the goad CLI has no uninstall_extension command - goad.py only ever calls
# run_extension with install=True, so this playbook is the supported teardown
# path. To drop emulation from the instance's enabled list afterwards, re-run
# `set_extensions <the extensions you want to keep>` - there is no
# disable_extension CLI command.)
#
# What IS removed:
#   - on the agents ([emulation_agents] = [domain]):
#       the ART install root C:\Tools\AtomicRedTeam (atomics checkout +
#       module installer leftovers), the invoke-atomicredteam module
#       (win_psmodule state=absent at the pinned version; powershell-yaml is
#       kept as a shared dependency), the Sandcat agent, the AllUsers profile
#       import line, the Windows Defender path exclusions THIS extension
#       added (the ART + sandcat dirs, as recorded by the install in the
#       registry marker HKLM:\SOFTWARE\GOAD\Emulation - issue #62), and the
#       marker itself, the git installer leftovers
#   - on the emulation VM ([emulation_server]):
#       the caldera systemd unit + service, /opt/caldera (venv + clone +
#       conf), the /etc/emulation state dir, the ufw 8888 rule (only if ufw
#       is active), the caldera service user
#
# What is NOT removed (deliberate):
#   - git itself (system-wide tool; other things may use it)
#   - the powershell-yaml module (shared dependency, other modules may use it)
#   - anything Defender/GOAD-core configured (realtime, ASR, PPL), and any
#     exclusion for the ART/sandcat paths that existed BEFORE the install
#     (not in the ownership marker) - only exclusions the extension added go
#   - the ART C:\Tools\AtomicRedTeam parent when other tooling lives there
#     (only the AtomicRedTeam subfolder is removed)
#   - any Caldera operation/agent history - the whole server dir goes; if
#     you want the operation reports, copy /opt/caldera/data first (the
#     playbook prints a reminder)

- name: Uninstall Atomic Red Team + Sandcat (windows machines)
  hosts: emulation_agents
  gather_facts: yes
  vars_files:
    - roles/atomic_redteam/defaults/main.yml
    - roles/sandcat_agent/defaults/main.yml
  tasks:
    # ---- Sandcat agent -------------------------------------------------------
    - name: Remove the sandcat boot scheduled task
      community.windows.win_scheduled_task:
        name: "{{ sandcat_task_name }}"
        state: absent

    - name: Stop any running sandcat agent
      ansible.windows.win_shell: |
        $p = Get-Process -Name sandcat -ErrorAction SilentlyContinue
        if ($p) { $p | Stop-Process -Force; Write-Output 'stopped' } else { Write-Output 'absent' }
      register: sandcat_stop
      changed_when: "'stopped' in sandcat_stop.stdout"
      failed_when: false

    - name: Remove the sandcat install dir
      ansible.windows.win_file:
        path: "{{ sandcat_install_dir }}"
        state: absent

    # ---- ART install root ----------------------------------------------------
    - name: Check if the ART install root exists
      ansible.windows.win_stat:
        path: "{{ art_install_root }}"
      register: art_root_stat

    - name: Remove the ART install root (atomics + installers)
      ansible.windows.win_file:
        path: "{{ art_install_root }}"
        state: absent
      when: art_root_stat.stat.exists | default(false)

    # ---- invoke-atomicredteam module -----------------------------------------
    # win_psmodule (the module the install uses) handles removal cleanly:
    # Uninstall-Module has no -AllUsers parameter, and win_powershell returns
    # `output` not `stdout`, so the old hand-rolled task failed on every host
    # (a changed_when on a missing key fails the task even with
    # failed_when:false, which then stopped the profile/exclusion cleanup
    # below). powershell-yaml is left in place (shared dependency).
    - name: Uninstall the invoke-atomicredteam module (pinned version)
      community.windows.win_psmodule:
        name: invoke-atomicredteam
        required_version: "{{ art_module_version }}"
        state: absent

    # ---- AllUsers profile import line ------------------------------------------
    # drops the lines the install marked with art_profile_marker, plus the
    # unmarked import line older versions of the role wrote
    - name: Remove the profile lines written by the install
      ansible.windows.win_shell: |
        $profilePath = $PROFILE.AllUsersAllHosts
        $marker = '{{ art_profile_marker }}'
        if (Test-Path $profilePath) {
          $current = @(Get-Content $profilePath)
          $kept = @($current | Where-Object {
            -not $_.EndsWith($marker) -and
            $_ -notmatch '^Import-Module invoke-atomicredteam -RequiredVersion \S+ -ErrorAction SilentlyContinue$'
          })
          if ($kept.Count -ne $current.Count) {
            Set-Content -Path $profilePath -Value $kept
            Write-Output "profile-cleaned"
          } else { Write-Output "profile-unchanged" }
        } else { Write-Output "profile-absent" }
      register: art_profile_cleanup
      changed_when: "'profile-cleaned' in art_profile_cleanup.stdout"
      failed_when: false

    # ---- Defender path exclusions (ONLY the ones this extension added) ----------
    # Issue #62: the install records every exclusion path it actually added in
    # a registry marker (emulation_owner_regkey / _value). Remove exactly those,
    # then delete the marker. A matching path that is NOT in the marker existed
    # before the install and is left alone. No marker at all (a host installed
    # before ownership tracking existed) -> remove nothing and report the
    # matching paths for manual review; ownership is never guessed from names.
    # Errors are not swallowed: a failed Remove-MpPreference fails the task.
    - name: Remove the Defender path exclusions this extension added
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $key = '{{ emulation_owner_regkey }}'
        $name = '{{ emulation_owner_value }}'
        $known = @('{{ art_install_root }}', '{{ art_atomics_dir }}', '{{ sandcat_install_dir }}')
        $current = @((Get-MpPreference).ExclusionPath)
        $owned = $null
        if (Test-Path $key) {
          $owned = (Get-ItemProperty -Path $key -Name $name -ErrorAction SilentlyContinue).$name
        }
        if ($null -eq $owned) {
          $present = @($known | Where-Object { $current -contains $_ })
          Write-Output ("marker=absent")
          Write-Output ("removed=")
          Write-Output ("kept-unowned=" + ($present -join ','))
        } else {
          $removed = @()
          foreach ($p in @($owned)) {
            if ($current -contains $p) {
              Remove-MpPreference -ExclusionPath $p
              $removed += $p
            }
          }
          Remove-ItemProperty -Path $key -Name $name
          $k = Get-Item -Path $key
          if (-not $k.Property -and -not (Get-ChildItem -Path $key)) {
            Remove-Item -Path $key
            $parent = Split-Path -Path $key -Parent
            $pk = Get-Item -Path $parent
            if (-not $pk.Property -and -not (Get-ChildItem -Path $parent)) { Remove-Item -Path $parent }
          }
          $after = @((Get-MpPreference).ExclusionPath)
          $kept = @($known | Where-Object { $after -contains $_ })
          Write-Output ("marker=deleted")
          Write-Output ("removed=" + ($removed -join ','))
          Write-Output ("kept-unowned=" + ($kept -join ','))
        }
      register: emulation_exclusion_removal
      changed_when: "'marker=deleted' in emulation_exclusion_removal.stdout"

    - name: Report Defender exclusions that were kept (not added by this extension)
      ansible.builtin.debug:
        msg: >-
          {{ emulation_exclusion_removal.stdout_lines | select('match', '^(marker|removed|kept-unowned)=') | join(' | ') }}
          {{ '- no ownership marker on this host (installed before ownership
          tracking); nothing was removed, review the kept paths by hand.'
          if 'marker=absent' in emulation_exclusion_removal.stdout else '' }}

- name: Uninstall the Caldera server (emulation VM)
  hosts: emulation_server
  become: yes
  vars_files:
    - roles/caldera_server/defaults/main.yml
  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes
  tasks:
    - name: Check if the caldera service unit exists
      ansible.builtin.stat:
        path: "{{ caldera_systemd_dir }}/{{ caldera_service_name }}.service"
      register: caldera_unit_stat

    - name: Stop + disable the caldera service
      ansible.builtin.systemd:
        name: "{{ caldera_service_name }}"
        state: stopped
        enabled: no
      when: caldera_unit_stat.stat.exists | default(false)
      failed_when: false

    - name: Remove the caldera systemd unit
      ansible.builtin.file:
        path: "{{ caldera_systemd_dir }}/{{ caldera_service_name }}.service"
        state: absent
      when: caldera_unit_stat.stat.exists | default(false)
      notify: Reload systemd

    # Keep the operation reports if the operator wants them - print where.
    - name: Reminder about Caldera operation data
      ansible.builtin.debug:
        msg: >-
          Removing {{ caldera_install_dir }} deletes all Caldera operation
          reports/agent history. Copy {{ caldera_install_dir }}/data somewhere
          first if you need it.

    - name: Remove the caldera install tree
      ansible.builtin.file:
        path: "{{ caldera_install_dir }}"
        state: absent

    - name: Remove the Node.js used for the UI build (tarball, unpacked dir, link)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ caldera_node_dir }}"
        - "{{ caldera_node_root }}/node-v{{ caldera_node_version }}-linux-x64"
        - "{{ caldera_node_root }}/node-v{{ caldera_node_version }}-linux-x64.tar.xz"

    - name: Remove the emulation state dir
      ansible.builtin.file:
        path: "{{ state_dir }}"
        state: absent

    - name: Remove the ufw 8888 rule (only when ufw is active)
      block:
        - name: Check if ufw is active
          ansible.builtin.command: ufw status
          changed_when: false
          register: uninstall_ufw
          failed_when: false

        - name: Delete the caldera ufw rule
          community.general.ufw:
            rule: allow
            port: "{{ caldera_port }}"
            proto: tcp
            delete: yes
          when: "'Status: active' in uninstall_ufw.stdout"
      when: caldera_unit_stat.stat.exists | default(false)

    - name: Remove the caldera service user
      ansible.builtin.user:
        name: "{{ caldera_user }}"
        state: absent
        remove: yes

    - name: Show what was kept
      ansible.builtin.debug:
        msg: >-
          Emulation extension uninstalled. Kept on purpose: git (system
          tool), all other Defender settings (only the exclusions this
          extension added were removed; pre-existing ones were kept), and any
          GOAD-core hardening. The
          emulation VM itself stays up (destroy it via the provider/goad
          CLI if you want the machine gone too).
