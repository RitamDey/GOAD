# emulation extension : Atomic Red Team framework deploy (windows domain hosts)
#
# Flow: git (sha256-verified installer) -> Defender path exclusions for the
# ART dirs ONLY -> PSGallery modules at PINNED versions (win_psmodule
# required_version) -> atomics repo cloned at the PINNED commit SHA (the repo
# has no tags/releases - see the defaults header for the SHA-bump upgrade
# policy) -> AllUsers profile (auto-import + atomics path) -> per-host
# verification in health_assertions (module importable + atomics populated +
# exclusion present).
#
# Defender posture note: the exclusions are Add-MpPreference -ExclusionPath
# entries scoped to the ART directories. Realtime protection, ASR, and every
# other Defender setting GOAD core configured are left untouched. On SRV02
# (core ships realtime-off) the exclusions are harmless no-ops.
#
# git is always called through art_git_exe (full path): a new WinRM shell is
# not guaranteed to see the PATH entry the git installer adds.

# ---- Transport: git for windows (sha256-verified) -----------------------------
- name: Check if git is already installed
  ansible.windows.win_stat:
    path: "{{ art_git_exe }}"
  register: art_git_stat

- name: Install git for windows (pinned installer, sha256-verified)
  block:
    - name: Create the ART install root
      ansible.windows.win_file:
        path: "{{ art_install_root }}"
        state: directory

    - name: Download the pinned git installer
      ansible.windows.win_get_url:
        url: "{{ art_git_url }}"
        dest: "{{ art_git_installer_path }}"
        checksum: "{{ art_git_installer_sha256 }}"
        checksum_algorithm: sha256

    - name: Install git silently
      ansible.windows.win_package:
        path: "{{ art_git_installer_path }}"
        product_id: "{{ art_git_product_id }}"
        arguments: /VERYSILENT /NORESTART /NOCANCEL /SP- /LOG="{{ art_install_root }}\\git-install.log"
        state: present
      register: art_git_install

    - name: Check that git runs from its install path
      ansible.windows.win_command:
        argv:
          - "{{ art_git_exe }}"
          - --version
      changed_when: false
      register: art_git_version

    - name: Clean up the git installer
      ansible.windows.win_file:
        path: "{{ art_git_installer_path }}"
        state: absent

  rescue:
    - name: Report the git install failure with diagnostics
      ansible.builtin.fail:
        msg: >-
          git-for-windows install failed on {{ inventory_hostname }}:
          {{ ansible_failed_result.msg | default(ansible_failed_result.stderr | default('no error output')) }}.
          The atomics clone needs git; fix the download/install and re-run.
  when: not art_git_stat.stat.exists

# ---- Defender exclusions FIRST (so the module install is not quarantined) ------
# ErrorActionPreference=Stop turns a failed Add-MpPreference into a task
# failure instead of a silent no-op.
- name: Add the Windows Defender path exclusions for the ART directories
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $paths = @('{{ art_install_root }}', '{{ art_atomics_dir }}')
    $current = (Get-MpPreference).ExclusionPath
    $added = @()
    foreach ($p in $paths) {
      if ($current -notcontains $p) {
        Add-MpPreference -ExclusionPath $p
        $added += $p
      }
    }
    Write-Output ("added=" + ($added -join ','))
  register: art_defender_exclusions
  changed_when: art_defender_exclusions.stdout | trim != 'added='

# ---- PSGallery modules at PINNED versions ---------------------------------------
# community.windows.win_psmodule is what GOAD core uses (ansible/roles/common):
# it enables TLS 1.2 (required by PSGallery), bootstraps NuGet and passes
# -Force, so Install-Module does not stop at the untrusted-repository prompt.
- name: Install powershell-yaml {{ art_powershell_yaml_version }} (invoke-atomicredteam dependency, pinned)
  community.windows.win_psmodule:
    name: powershell-yaml
    required_version: "{{ art_powershell_yaml_version }}"
    state: present
  register: art_yaml_install
  until: art_yaml_install is succeeded
  retries: 3
  delay: 10

- name: Install invoke-atomicredteam {{ art_module_version }} (exact pin from PSGallery)
  community.windows.win_psmodule:
    name: invoke-atomicredteam
    required_version: "{{ art_module_version }}"
    allow_clobber: yes
    state: present
  register: art_module_install
  until: art_module_install is succeeded
  retries: 3
  delay: 10

# ---- Atomics repo at the PINNED commit ------------------------------------------
- name: Check if the atomics checkout exists
  ansible.windows.win_stat:
    path: "{{ art_atomics_dir }}\\.git"
  register: art_atomics_git

- name: Create the ART install root
  ansible.windows.win_file:
    path: "{{ art_install_root }}"
    state: directory

- name: Clone atomic-red-team (full clone so the SHA checkout works)
  ansible.windows.win_command:
    argv:
      - "{{ art_git_exe }}"
      - clone
      - --quiet
      - "{{ art_repo_url }}"
      - "{{ art_atomics_dir }}"
  when: not art_atomics_git.stat.exists

- name: Read the checked-out atomics commit
  ansible.windows.win_command:
    argv:
      - "{{ art_git_exe }}"
      - -C
      - "{{ art_atomics_dir }}"
      - rev-parse
      - HEAD
  changed_when: false
  register: art_head_before

- name: Checkout the pinned commit SHA
  ansible.windows.win_command:
    argv:
      - "{{ art_git_exe }}"
      - -C
      - "{{ art_atomics_dir }}"
      - checkout
      - --quiet
      - "{{ art_repo_sha }}"
  when: art_head_before.stdout | trim != art_repo_sha

- name: Assert the checked-out atomics commit matches the pin
  ansible.windows.win_command:
    argv:
      - "{{ art_git_exe }}"
      - -C
      - "{{ art_atomics_dir }}"
      - rev-parse
      - HEAD
  changed_when: false
  register: art_head
  failed_when: art_head.stdout | trim != art_repo_sha

# ---- AllUsers profile: auto-import + atomics path --------------------------------
# Every line this role owns ends with art_profile_marker. The task drops the
# marked lines (and the unmarked import line older versions of this role
# wrote) and appends the current ones, so a re-run after a pin bump updates
# the profile instead of leaving the old line in place.
- name: Configure the AllUsers profile (auto-import + atomics path)
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $profilePath = $PROFILE.AllUsersAllHosts
    $marker = '{{ art_profile_marker }}'
    $wanted = @(
      "Import-Module invoke-atomicredteam -RequiredVersion {{ art_module_version }} -ErrorAction SilentlyContinue $marker",
      "`$PSDefaultParameterValues['Invoke-AtomicTest:PathToAtomicsFolder'] = '{{ art_atomics_path }}' $marker"
    )
    $dir = Split-Path $profilePath
    if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
    $current = @()
    if (Test-Path $profilePath) { $current = @(Get-Content $profilePath) }
    $kept = @($current | Where-Object {
      -not $_.EndsWith($marker) -and
      $_ -notmatch '^Import-Module invoke-atomicredteam -RequiredVersion \S+ -ErrorAction SilentlyContinue$'
    })
    $new = $kept + $wanted
    if (($current -join "`n") -ne ($new -join "`n")) {
      Set-Content -Path $profilePath -Value $new
      Write-Output "profile-updated"
    } else { Write-Output "profile-already" }
  register: art_profile
  changed_when: "'profile-updated' in art_profile.stdout"
  when: art_profile_import | bool
