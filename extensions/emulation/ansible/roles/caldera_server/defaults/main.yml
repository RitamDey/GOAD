# emulation extension : caldera_server role defaults
#
# Pin Caldera to an EXACT release (fully reproducible lab).
#   caldera_version     - the release TAG cloned at install time
#   caldera_commit_sha  - the commit the tag points at (verified at build time
#                         via the GitHub API; recorded here so a force-moved
#                         tag is detectable on re-runs: if clone + checkout of
#                         the tag does not land on this SHA, the role fails).
# Tag 5.3.0 (published 2025-04-24) is an annotated tag object whose target
# commit is b24f6e7a99cab19cbf417009bda9b9c6c81abc31.
caldera_version: "5.3.0"
caldera_commit_sha: "b24f6e7a99cab19cbf417009bda9b9c6c81abc31"
caldera_repo_url: "https://github.com/mitre/caldera.git"

# Submodule SHips at fixed SHAs in the 5.3.0 tree (gitmodules-verified). The
# role clones with --recursive at the pinned tag, then asserts these SHAs so
# an upstream submodule force-push cannot silently drift the lab.
caldera_submodule_shas:
  plugins/emu: "fdb0bab5c9c3e1f6fcff57cdd2a4d999955cb7b8"       # CTID adversary emulation plans
  plugins/sandcat: "0a35cd525f1cfabfcf602282428055c41f144513"   # sandcat agent (2.9.0-0723cab)
  plugins/atomic: "b90958810ffae1d328124f9e8af75f524616b27f"    # ART technique ingestion plugin

# Caldera 5.3.0 supports python 3.9+ (verified: README + requirements python
# check in conf/default.yml). ubuntu-22.04 ships python3.10 - no PPA needed.
caldera_python_bin: python3.10

# Install location + service user
caldera_install_dir: /opt/caldera
caldera_user: caldera

# Server ports.
#   8888 - the Caldera UI AND the default http contact (agent/Sandcat callback)
#          port. One port serves both (conf/default.yml: port: 8888 +
#          app.contact.http: http://0.0.0.0:8888). Windows hosts MUST be able
#          to reach the emulation VM on 8888 or Sandcat can never check in -
#          this is the day-one gotcha, see the README port matrix.
caldera_port: 8888

# Lab credentials (this is a lab - same changeme convention as the elk
# extension). Written into conf/local.yml, which
# Caldera reads INSTEAD of generating its own secure config (server.py's
# ensure_local_config() only creates local.yml when it does not exist, so a
# pre-seeded file wins and the values stay deterministic).
caldera_red_password: "changeme"
caldera_blue_password: "changeme"
caldera_api_key_red: "ADMIN123"
caldera_api_key_blue: "BLUEADMIN123"

# local.yml hardening knobs kept at the default.yml values (lab-parity) but
# made explicit so the config is fully owned by this extension.
caldera_crypt_salt: "REPLACE_WITH_RANDOM_VALUE"
caldera_encryption_key: "ADMIN123"

# Plugins enabled in conf/local.yml: the stock default.yml list plus emu
# (emu, sandcat and atomic are the plugins this extension exists for).
# magma (the Vue UI) is not listed on purpose: Caldera 5.3.0 always enables
# it (app/service/app_svc.py: `plugin.name in plugins or plugin.name ==
# 'magma'`). It does need its dist/ built - see the node vars below.
caldera_plugins:
  - access
  - atomic
  - compass
  - debrief
  - emu
  - fieldmanual
  - manx
  - response
  - sandcat
  - stockpile
  - training

# Fetch the emu plugin's non-redistributable payloads (AdFind, PsExec, putty,
# mimikatz, ...) via plugins/emu/download_payloads.sh after the server is up.
# Several CTID plans (notably Turla) reference them. It is best-effort: the
# script pulls from third-party sites WITHOUT version pins or checksums, some
# of which are frequently offline, so a failed download never fails the play.
# Set to false for an air-gapped lab, or to skip pulling offensive binaries.
caldera_fetch_emu_payloads: true

# conf/local.yml = the release's own conf/default.yml + these overrides.
# Caldera 5.3.0 reads ONLY conf/local.yml when started with `-E local`
# (server.py: apply_config('main', strip_yml(conf/<env>.yml)), no merge with
# default.yml), and the contacts read keys such as app.contact.tcp at start,
# so every stock key has to be present - hence copy-then-override instead of
# a hand-written template. `port` is added as an integer in tasks/config.yml
# (a templated value nested in a var would come out as the string '8888').
caldera_config_overrides:
  users:
    red:
      red: "{{ caldera_red_password }}"
    blue:
      blue: "{{ caldera_blue_password }}"
  api_key_red: "{{ caldera_api_key_red }}"
  api_key_blue: "{{ caldera_api_key_blue }}"
  crypt_salt: "{{ caldera_crypt_salt }}"
  encryption_key: "{{ caldera_encryption_key }}"
  host: 0.0.0.0
  app.contact.http: "http://0.0.0.0:{{ caldera_port }}"
  plugins: "{{ caldera_plugins }}"
  # Keep operation reports and exfil inside the install tree. The stock
  # default.yml points these at /tmp (reports_dir: /tmp, exfil_dir:
  # /tmp/caldera); the systemd unit sets PrivateTmp=yes, so a /tmp path is a
  # per-service private tmp that is wiped on every restart - the reports
  # written by teardown (app_svc.py _write_reports) would be lost. data/ is
  # the dir the README/uninstall already treat as the operation-history
  # location, and it is owned by the caldera user.
  reports_dir: "{{ caldera_install_dir }}/data"
  exfil_dir: "{{ caldera_install_dir }}/data/exfil"

# Node.js for the one-time build of the magma (Vue) UI. Caldera 5.3.0 cannot
# start without plugins/magma/dist (app/api/rest_api.py add_static on
# plugins/magma/dist/assets) and its README asks for Node v16+. Pinned
# official tarball; sha256 copied from
# https://nodejs.org/dist/v22.23.5/SHASUMS256.txt and re-checked by hashing
# the downloaded file.
caldera_node_version: "22.23.5"
caldera_node_sha256: "cdeb8670a0c81f51b4dc4ac61919f9b1ad917b304bf8221eb939570663d240f8"
caldera_node_url: "https://nodejs.org/dist/v{{ caldera_node_version }}/node-v{{ caldera_node_version }}-linux-x64.tar.xz"
caldera_node_root: /opt
caldera_node_dir: "{{ caldera_node_root }}/node"

# Systemd
caldera_service_name: caldera
caldera_systemd_dir: /etc/systemd/system

# State directory (pin records for idempotent re-runs)
state_dir: /etc/emulation

# Health-check tuning. The first start is slow: the emu and atomic plugins
# git-clone their content repos while enabling (plugins/emu/hook.py,
# plugins/atomic/app/atomic_svc.py).
caldera_health_retries: 120       # x5s = 10 min for the UI to answer 200
caldera_health_delay: 5
