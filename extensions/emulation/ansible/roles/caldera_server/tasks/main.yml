# emulation extension : Caldera 5.3.0 server deploy (emulation VM, ubuntu-22.04)
#
# Flow: deps -> dedicated user -> clone at pinned tag (+ submodule SHA
# assertions) -> venv with the TAG's OWN requirements.txt (master drifts: its
# aiohttp pin already differs from 5.3.0's) -> pre-seeded conf/local.yml (so
# ensure_local_config() never generates random credentials) -> systemd unit
# -> magma UI build (pinned Node.js) -> wait-for-200 health check ->
# access-info debug + pin records.
#
# Caldera 5.x is python at runtime: server.py is the entrypoint and the go
# toolchain is only needed to BUILD sandcat payloads from source. The sandcat
# submodule ships prebuilt payloads (payloads/sandcat.go-windows et al), so
# no golang install here. Node.js is only used once, to build the magma UI.

# ---- OS dependencies --------------------------------------------------------
- name: Install Caldera OS dependencies
  ansible.builtin.apt:
    name:
      - git
      - acl               # lets become_user switch to the unprivileged caldera user
      - python3.10
      - python3.10-venv
      - python3-pip
      - python3.10-dev    # pyminizip 0.2.6 is sdist-only on PyPI: C build
      - gcc               # (it bundles its own zlib 1.2.11 sources)
      - xz-utils          # unpack the Node.js .tar.xz
      - curl              # emu download_payloads.sh
      - unzip             # emu download_payloads.sh (AdFind.zip, PSTools.zip, ...)
    state: present
    update_cache: yes
    cache_valid_time: 3600

# ---- Dedicated service user --------------------------------------------------
- name: Create the caldera service user
  ansible.builtin.user:
    name: "{{ caldera_user }}"
    shell: /usr/sbin/nologin
    home: "{{ caldera_install_dir }}"
    # no skeleton files: the git clone below needs an empty directory
    create_home: no
    system: yes
    comment: "Caldera adversary emulation server (GOAD emulation extension)"

- name: Create the state dir
  ansible.builtin.file:
    path: "{{ state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# ---- Clone at the pinned release --------------------------------------------
# The caldera user cannot create a folder in /opt, so create the (empty)
# install dir for it first; git clones into an existing empty directory.
- name: Create the install dir
  ansible.builtin.file:
    path: "{{ caldera_install_dir }}"
    state: directory
    owner: "{{ caldera_user }}"
    group: "{{ caldera_user }}"
    mode: "0755"

- name: Check if the pinned checkout already exists
  ansible.builtin.stat:
    path: "{{ caldera_install_dir }}/server.py"
  register: caldera_checkout

- name: Read the current checkout HEAD
  ansible.builtin.command: git rev-parse HEAD
  args:
    chdir: "{{ caldera_install_dir }}"
  # the checkout is owned by caldera; running git as root trips git's
  # safe.directory check ("detected dubious ownership") and returns nothing
  become_user: "{{ caldera_user }}"
  changed_when: false
  failed_when: false
  register: caldera_existing_head
  when: caldera_checkout.stat.exists

# A sync is needed on first install, and when caldera_version was bumped (the
# existing HEAD no longer matches the pinned commit). On a normal re-run HEAD
# already matches, so the git task is skipped and the role stays idempotent -
# the git module with force+recursive always reports "changed", so it must
# not run on every play.
- name: Decide whether the checkout needs a (re)sync
  ansible.builtin.set_fact:
    caldera_needs_sync: "{{ (not caldera_checkout.stat.exists) or (caldera_existing_head.stdout | default('') | trim != caldera_commit_sha) }}"

- name: Clone / move Caldera to the pinned tag
  ansible.builtin.git:
    repo: "{{ caldera_repo_url }}"
    dest: "{{ caldera_install_dir }}"
    version: "{{ caldera_version }}"
    recursive: yes
    force: yes
  become_user: "{{ caldera_user }}"
  register: caldera_clone
  when: caldera_needs_sync | bool

# The tag pin alone is not a tamper-proof pin (tags can be force-moved) -
# assert the checked-out commit AND every pinned submodule SHA. A mismatch
# fails loudly instead of silently drifting the lab.
- name: Assert the checked-out Caldera commit matches the recorded SHA
  ansible.builtin.command: git rev-parse HEAD
  args:
    chdir: "{{ caldera_install_dir }}"
  # run as the tree's owner (see above - root trips safe.directory)
  become_user: "{{ caldera_user }}"
  changed_when: false
  register: caldera_head
  failed_when: caldera_head.stdout | trim != caldera_commit_sha

- name: Assert every pinned submodule commit
  ansible.builtin.command: git rev-parse HEAD
  args:
    chdir: "{{ caldera_install_dir }}/{{ item.key }}"
  become_user: "{{ caldera_user }}"
  loop: "{{ caldera_submodule_shas | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
  register: caldera_submodule_heads
  # inside a loop the registered var holds the CURRENT item's result
  failed_when: caldera_submodule_heads.stdout | trim != item.value

- name: Own the install tree
  ansible.builtin.file:
    path: "{{ caldera_install_dir }}"
    state: directory
    owner: "{{ caldera_user }}"
    group: "{{ caldera_user }}"
    recurse: yes

# ---- Python venv + the tag's OWN pinned requirements -------------------------
- name: Create the python venv
  ansible.builtin.command:
    cmd: "{{ caldera_python_bin }} -m venv venv"
    chdir: "{{ caldera_install_dir }}"
    creates: "{{ caldera_install_dir }}/venv/bin/activate"
  # same user as the pip tasks below, or they cannot write into the venv
  become_user: "{{ caldera_user }}"

- name: Install the 5.3.0 requirements (exact pins, from the checkout)
  ansible.builtin.pip:
    requirements: "{{ caldera_install_dir }}/requirements.txt"
    virtualenv: "{{ caldera_install_dir }}/venv"
    virtualenv_python: "{{ caldera_python_bin }}"
  become_user: "{{ caldera_user }}"

- name: Install the emu plugin dependency (pyminizip)
  ansible.builtin.pip:
    name: "pyminizip==0.2.6"
    virtualenv: "{{ caldera_install_dir }}/venv"
    virtualenv_python: "{{ caldera_python_bin }}"
  become_user: "{{ caldera_user }}"

# ---- magma UI build + conf/local.yml ---------------------------------------------
- name: Build the magma UI
  ansible.builtin.include_tasks: ui.yml

- name: Deploy conf/local.yml
  ansible.builtin.include_tasks: config.yml

# ---- Pin the plugin content (before the first start, so the plugins skip
#      their own unpinned clone) ---------------------------------------------------
- name: Pin the emu + atomic plugin content
  ansible.builtin.include_tasks: content.yml

# ---- Firewall: open the UI / agent-callback port -------------------------------
# 8888 is BOTH the UI port and the Sandcat http contact. Every domain windows
# machine connects back to it. ufw is left untouched if inactive (the lab's
# ubuntu templates ship without a firewall enabled) - idempotent either way.
- name: Check if ufw is active
  ansible.builtin.command: ufw status
  changed_when: false
  register: caldera_ufw
  failed_when: false

- name: Allow the caldera port through ufw (when active)
  community.general.ufw:
    rule: allow
    port: "{{ caldera_port }}"
    proto: tcp
  when: "'Status: active' in caldera_ufw.stdout"

# ---- Systemd unit ---------------------------------------------------------------
- name: Deploy the caldera systemd unit
  ansible.builtin.template:
    src: caldera.service.j2
    dest: "{{ caldera_systemd_dir }}/{{ caldera_service_name }}.service"
    mode: "0644"
  notify: Restart caldera

# apply a changed unit/config/UI now, so the health checks below (and the
# health_assertions stage) test the process that will keep running
- name: Restart caldera now if the unit, config or UI changed
  ansible.builtin.meta: flush_handlers

- name: Enable + start the caldera service
  ansible.builtin.systemd:
    name: "{{ caldera_service_name }}"
    state: started
    enabled: yes
    daemon_reload: yes

# ---- Health check: wait for a 200 from the UI -----------------------------------
- name: Wait for the Caldera UI to answer
  block:
    - name: Poll the Caldera UI until it returns 200
      ansible.builtin.uri:
        url: "http://localhost:{{ caldera_port }}"
        status_code: 200
      register: caldera_ui
      until: caldera_ui.status == 200
      retries: "{{ caldera_health_retries }}"
      delay: "{{ caldera_health_delay }}"
      timeout: 10

    # /api/v2/health needs the api key (401 without) and lists the plugins.
    # (GET /api/rest is not a probe: it parses a JSON body and answers 500.)
    - name: Assert the API answers with the lab api key
      ansible.builtin.uri:
        url: "http://localhost:{{ caldera_port }}/api/v2/health"
        method: GET
        headers:
          KEY: "{{ caldera_api_key_red }}"
        status_code: 200
      register: caldera_api
      until: caldera_api.status == 200
      retries: 5
      delay: 5

  rescue:
    - name: Diagnose the caldera service on health-check failure
      ansible.builtin.command: systemctl status caldera --no-pager -l
      changed_when: false
      register: caldera_status
      failed_when: false

    - name: Fetch the last service log lines
      ansible.builtin.command: journalctl -u caldera -n 40 --no-pager
      changed_when: false
      register: caldera_logs
      failed_when: false

    - name: Report the caldera health-check failure diagnostics
      ansible.builtin.fail:
        msg: |
          Caldera did not become healthy on port {{ caldera_port }}.
          ---- systemctl status ----
          {{ caldera_status.stdout | default('unavailable') }}
          ---- journalctl (last 40 lines) ----
          {{ caldera_logs.stdout | default('unavailable') }}

# ---- emu non-redistributable payloads (best-effort, after the server is up) ------
# plugins/emu/download_payloads.sh pulls AdFind / PsExec / putty / mimikatz /
# ... that the plugin cannot ship (licensing). It runs here AFTER the health
# check so the emu plugin has already cloned data/adversary-emulation-plans
# (the script copies some payloads into the Turla plan dir). Best-effort:
# the script has no `set -e` and the sites are unpinned and often down, so
# a failed download must not fail the install. A sentinel file makes it
# run once; delete it (or bump nothing) to re-pull.
- name: Fetch the emu non-redistributable payloads (best-effort)
  ansible.builtin.shell:
    cmd: |
      bash download_payloads.sh > payloads-download.log 2>&1 || true
      touch .goad-emu-payloads-done
    chdir: "{{ caldera_install_dir }}/plugins/emu"
    creates: "{{ caldera_install_dir }}/plugins/emu/.goad-emu-payloads-done"
  become_user: "{{ caldera_user }}"
  when: caldera_fetch_emu_payloads | bool

# ---- Pin records + access info ---------------------------------------------------
- name: Persist the install pins (version / SHAs) in the state dir
  ansible.builtin.copy:
    dest: "{{ state_dir }}/caldera-pins"
    # deterministic content: no install timestamp, or the task reports
    # "changed" on every re-run. The pins change only on a real version bump.
    content: |
      caldera_tag={{ caldera_version }}
      caldera_commit={{ caldera_commit_sha }}
      {% for name, sha in caldera_submodule_shas.items() %}
      {{ name }}={{ sha }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"

- name: Show Caldera access information
  ansible.builtin.debug:
    msg: |
      ================= CALDERA (emulation extension) =================
      UI (red user)   : http://{{ ansible_host }}:{{ caldera_port }}
      red login       : red / {{ caldera_red_password }}
      blue login      : blue / {{ caldera_blue_password }}
      red API key     : {{ caldera_api_key_red }}
      config          : {{ caldera_install_dir }}/conf/local.yml
      service         : systemctl {{ 'status' }} {{ caldera_service_name }}
      Sandcat contact : http://{{ ansible_host }}:{{ caldera_port }}
        (the UI and the agent callback share port {{ caldera_port }} -
         windows hosts must be able to reach this VM on it)
      ==================================================================
