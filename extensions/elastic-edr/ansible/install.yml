# elastic-edr extension : install playbook
# Play 1 : deploy the Elastic Stack (ES 8.x + Kibana + Fleet) + a dedicated
#          Fleet Server on :8220 + EDR policies + detection rules + token,
#          then assert the control plane is healthy (agents online, rules
#          installed, event data flowing).
# Play 2 : install the AppLocker audit policy + host-side logging (4688/4104)
#          + Sysmon + the Elastic Agent on every domain windows machine and
#          enroll it in the Fleet Server, then assert each endpoint came up
#          healthy (per-host results; no single slow host fails the play).
# Play 3 : roll up the per-host results into one table on the elastic-edr VM
#          (stage: aggregate) and grade the fleet.
#
# Inter-play failure gate (#52): any_errors_fatal on all three plays. A
# stack-side failure must not leave play 2 instrumenting agents against a
# dead stack (the stale-token-file re-provision path is the concrete case),
# and an aggregate roll-up over a partially-failed fleet would misgrade.
# Caveat: --tags partial runs can bypass a play whose tagged role never
# runs; the flag still holds WITHIN each executed play. Full runs (the
# supported flow) always get the strict gate.

- name: Install Elastic Stack (EDR)
  hosts: elastic-edr_server
  become: yes
  any_errors_fatal: true
  roles:
    - { role: 'elastic_stack', tags: 'elastic_stack' }
    - { role: 'health_assertions', tags: 'health_assertions', stage: 'verify_stack' }

- name: Install AppLocker + Sysmon + Elastic Agent (Fleet / EDR) on windows machines
  hosts: elastic-edr_agents
  any_errors_fatal: true
  pre_tasks:
    - name: Read enrollment token from the elastic-edr machine
      ansible.builtin.shell: cat /etc/elastic-edr/enrollment-token
      delegate_to: elastic-edr
      become: yes
      changed_when: false
      register: edr_token

    - name: Set enrollment token fact
      ansible.builtin.set_fact:
        edr_enrollment_token: "{{ edr_token.stdout }}"

    - name: Set elastic host facts
      ansible.builtin.set_fact:
        elastic_host: "{{ hostvars['elastic-edr'].ansible_host }}"
        kibana_port: 5601
        fleet_server_port: 8220

  roles:
    - { role: 'applocker', tags: 'applocker' }
    - { role: 'endpoint_logging', tags: 'endpoint_logging' }
    - { role: 'sysmon', tags: 'agent' }
    - { role: 'elastic_agent_win', tags: 'agent' }
    - { role: 'health_assertions', tags: 'health_assertions', stage: 'verify_agents' }

- name: Roll up endpoint health (aggregate)
  hosts: elastic-edr_server
  become: yes
  any_errors_fatal: true
  roles:
    - { role: 'health_assertions', tags: 'health_assertions', stage: 'aggregate' }
