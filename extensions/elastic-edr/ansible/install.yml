# elastic-edr extension : install playbook
# Play 1 : deploy the Elastic Stack (ES 8.x + Kibana + Fleet) + a dedicated
#          Fleet Server on :8220 + EDR policies + detection rules + token
# Play 2 : install Sysmon + AppLocker audit policy + host-side logging
#          (4688/4104) + the Elastic Agent on every domain windows machine,
#          and enroll it in the Fleet Server using the token from play 1.

- name: Install Elastic Stack (EDR)
  hosts: elastic-edr_server
  become: yes
  roles:
    - { role: 'elastic_stack', tags: 'elastic_stack' }

- name: Install Sysmon + Elastic Agent (Fleet / EDR) on windows machines
  hosts: elastic-edr_agents
  pre_tasks:
    - name: Read enrollment token from the elastic-edr machine
      ansible.builtin.shell: cat /etc/elastic-edr/enrollment-token
      delegate_to: elastic-edr
      become: yes
      changed_when: false
      register: edr_token

    - name: Set enrollment token fact
      ansible.builtin.set_fact:
        edr_enrollment_token: "{{ edr_token.stdout }}"

    - name: Set elastic host facts
      ansible.builtin.set_fact:
        elastic_host: "{{ hostvars['elastic-edr'].ansible_host }}"
        kibana_port: 5601
        fleet_server_port: 8220

  roles:
    - { role: 'applocker', tags: 'applocker' }
    - { role: 'endpoint_logging', tags: 'endpoint_logging' }
    - { role: 'sysmon', tags: 'agent' }
    - { role: 'elastic_agent_win', tags: 'agent' }
