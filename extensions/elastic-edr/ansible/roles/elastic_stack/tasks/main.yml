# elastic-edr extension : stack role
# Deploys a self managed Elastic Stack 8.x (Elasticsearch + Kibana + Fleet) with
# X-Pack security enabled (TLS disabled for a simple isolated lab) and TWO
# preconfigured agent policies:
#   - Fleet-Server-Policy : a dedicated Fleet Server (control plane on :8220),
#     installed on this VM as its single elastic-agent (BSL / LME / elastic-
#     container pattern). Windows agents enroll at https://<vm>:8220 --insecure.
#   - GOAD-EDR-Policy     : the windows endpoints policy (system package via
#     preconfiguration); the Elastic Defend engine (the "endpoint" integration,
#     EDRComplete preset) and the "windows" integration (Sysmon / PowerShell /
#     Defender + applocker winlog) are attached through the Fleet API, since the
#     EDR engine cannot be preconfigured in kibana.yml.
# Also enables the Detection Engine and installs + enables the prepackaged SIEM
# detection rules (attack -> alert loop), and emits a Fleet enrollment token to
# {{ state_dir }} for the windows agent play.

- name: Ensure required dependencies
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - gnupg2
      - curl
    state: present
    update_cache: yes

- name: Add Elasticsearch apt key
  ansible.builtin.apt_key:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    state: present

- name: Add Elasticsearch apt repository ({{ elastic_repo_version }})
  ansible.builtin.apt_repository:
    repo: 'deb https://artifacts.elastic.co/packages/{{ elastic_repo_version }}/apt stable main'
    state: present
    update_cache: true

- name: State dir
  ansible.builtin.file:
    path: "{{ state_dir }}"
    state: directory
    mode: "0750"
    owner: root
    group: root

- name: Check if bootstrap password is already stored
  ansible.builtin.stat:
    path: "{{ state_dir }}/bootstrap-password"
  register: bootstrap_file

# Fresh install : apt prints the generated elastic superuser password on first
# setup - but ONLY when apt actually installs. On a re-run with a wiped state
# dir (ES already installed), apt is idempotent and prints no password line:
# the extraction below then yields an empty string, the persist task skips, and
# the probe-first auth block further down RECOVERS the run (probe 200 -> the
# lab password from the previous install still works, bootstrap never needed).
# Exact-version pin via apt's name==version syntax (the 8.x suite carries every
# historical 8.y.z - see defaults/main.yml for the suite vs version split).
- name: Install Elasticsearch (fresh, security autoconfig)
  ansible.builtin.apt:
    name: "elasticsearch={{ elastic_stack_version }}"
    state: present
    update_cache: yes
  register: es_install
  when: not bootstrap_file.stat.exists

- name: Extract generated elastic bootstrap password (tolerates idempotent re-runs)
  ansible.builtin.set_fact:
    es_bootstrap_password: >-
      {{ (es_install.stdout | default('')
          | regex_search('elastic built-in superuser is : (\S+)', '\1')) | default([''], true) | first }}
  when: not bootstrap_file.stat.exists

- name: Persist bootstrap password for re-runs
  ansible.builtin.copy:
    content: "{{ es_bootstrap_password }}"
    dest: "{{ state_dir }}/bootstrap-password"
    mode: "0640"
    owner: root
    group: root
  when: >-
    not bootstrap_file.stat.exists and (es_bootstrap_password | default('') | length) > 0

- name: Read stored bootstrap password
  ansible.builtin.slurp:
    src: "{{ state_dir }}/bootstrap-password"
  register: bootstrap_stored
  when: bootstrap_file.stat.exists

- name: Set bootstrap password fact (stored)
  ansible.builtin.set_fact:
    es_bootstrap_password: "{{ (bootstrap_stored.content | b64decode).trim }}"
  when: bootstrap_file.stat.exists

# Lower the java heap so ES fits the 16GB lab VM.
- name: Set Elasticsearch java heap
  ansible.builtin.copy:
    dest: /etc/default/elasticsearch
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by GOAD elastic-edr extension
      MAX_DIRECT_MEMORY={{ elastic_heap }}
      ES_JAVA_OPTS="-Xms{{ elastic_heap }} -Xmx{{ elastic_heap }}"

# Security on, TLS off -> plain http on 9200 (isolated lab).
- name: Configure Elasticsearch (security on, TLS off)
  ansible.builtin.copy:
    src: elasticsearch.yml
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: "0660"

- name: Raise vm.max_map_count
  ansible.builtin.sysctl:
    name: vm.max_map_count
    value: "262144"
    state: present
    sysctl_set: yes

- name: Restart Elasticsearch
  ansible.builtin.service:
    name: elasticsearch
    state: restarted

# Re-run safe auth (a stored bootstrap password is INVALID on re-runs):
# the first run rotates elastic's password to elastic_password, so on any
# later run the stored bootstrap value no longer authenticates. Probe both:
#   1. wait for the port to answer at all (200 security-off / 401 security-on)
#   2. try the LAB password (elastic_password) against _cluster/health
#   3. on 401, try the STORED/FRESH bootstrap password the same way
#   4. effective password = whichever authenticated; loud fail with
#      remediation if NEITHER does
# Fresh run  -> lab 401, bootstrap 200 -> bootstrap path -> rotation runs
# Re-run     -> lab 200 -> lab path -> rotation SKIPPED (idempotent)
# Wiped state dir, ES installed -> lab 200 -> lab path (bootstrap not needed;
#             apt printed no password line, extraction yields '' - recovered)
# Both stale -> lab 401 + bootstrap 401 -> bespoke failure with remediation
- name: Wait for Elasticsearch to answer ({{ es_http_port }}, any auth state)
  ansible.builtin.uri:
    url: "http://localhost:{{ es_http_port }}/"
    status_code: [200, 401]
  register: es_port_probe
  failed_when: false
  until: es_port_probe.status in [200, 401]
  retries: 30
  delay: 10
  timeout: 30

- name: Probe elastic auth with the lab password
  ansible.builtin.uri:
    url: "http://localhost:{{ es_http_port }}/_cluster/health"
    user: "elastic"
    password: "{{ elastic_password }}"
    status_code: [200, 401]
  register: es_auth_probe
  failed_when: false
  until: es_auth_probe.status in [200, 401]
  retries: 10
  delay: 5
  timeout: 30

- name: Probe elastic auth with the bootstrap password
  ansible.builtin.uri:
    url: "http://localhost:{{ es_http_port }}/_cluster/health"
    user: "elastic"
    password: "{{ es_bootstrap_password }}"
    status_code: [200, 401]
  register: es_bootstrap_probe
  failed_when: false
  until: es_bootstrap_probe.status in [200, 401]
  retries: 3
  delay: 5
  timeout: 30
  when:
    - (es_auth_probe.status | default(0)) != 200
    - (es_bootstrap_password | default('')) | length > 0

# Both credentials rejected (or no bootstrap at all): fail LOUD with the
# remediation instead of a generic retry-exhausted health-check error.
- name: Fail with remediation if neither the lab nor the bootstrap password authenticates
  ansible.builtin.fail:
    msg: >-
      Cannot authenticate to Elasticsearch as 'elastic': the lab password
      (elastic_password) returned HTTP {{ es_auth_probe.status | default('n/a') }}
      and the bootstrap password {{ 'is not available' if (es_bootstrap_password | default('')) | length == 0 else 'returned HTTP ' ~ (es_bootstrap_probe.status | default('n/a')) }}.
      Remediation, pick one:
      (1) reset the elastic password and re-run:
          /usr/share/elasticsearch/bin/elasticsearch-reset-password -u elastic -i
          then set elastic_password (elastic_stack/defaults or instance vars) to that value;
      (2) if you know the current elastic password, write it into
          elastic_password and re-run;
      (3) on a genuinely fresh first run, delete {{ state_dir }} and re-run the
          playbook so the bootstrap password is re-extracted from the apt output.
  when: >-
    (es_auth_probe.status | default(0)) != 200
    and (es_bootstrap_probe.status | default(0)) != 200

- name: Resolve the effective elastic password (lab password first, bootstrap fallback)
  ansible.builtin.set_fact:
    es_effective_password: >-
      {{ elastic_password if (es_auth_probe.status | default(0)) == 200 else es_bootstrap_password }}

- name: Wait for Elasticsearch cluster health ({{ es_http_port }})
  ansible.builtin.uri:
    url: "http://localhost:{{ es_http_port }}/_cluster/health"
    user: "elastic"
    password: "{{ es_effective_password }}"
    status_code: 200
  register: es_health
  until: es_health.status == 200
  retries: 30
  delay: 10
  timeout: 30

# Set known built-in user passwords so Kibana + Fleet API can authenticate.
# Skipped when the lab password already authenticates (re-runs): the rotation
# already happened on the first run, and re-authenticating with the stored
# bootstrap value would 401. Fresh runs take the bootstrap path.
- name: Set elastic superuser password
  ansible.builtin.uri:
    url: "http://localhost:{{ es_http_port }}/_security/user/elastic/_password"
    method: PUT
    user: "elastic"
    password: "{{ es_effective_password }}"
    body_format: json
    body:
      password: "{{ elastic_password }}"
  register: set_elastic_pw
  until: set_elastic_pw.status in [200]
  retries: 5
  delay: 5
  when: (es_auth_probe.status | default(0)) != 200

- name: Set kibana_system password
  ansible.builtin.uri:
    url: "http://localhost:{{ es_http_port }}/_security/user/kibana_system/_password"
    method: PUT
    user: "elastic"
    password: "{{ elastic_password }}"
    body_format: json
    body:
      password: "{{ kibana_system_password }}"
  register: set_kibana_pw
  until: set_kibana_pw.status in [200]
  retries: 5
  delay: 5

# Install Kibana (serves Fleet on 5601, http). Same exact-version pin.
- name: Install Kibana
  ansible.builtin.apt:
    name: "kibana={{ elastic_stack_version }}"
    state: present
    update_cache: yes

- name: Configure Kibana + Fleet preconfiguration
  ansible.builtin.template:
    src: kibana.yml
    dest: /etc/kibana/kibana.yml
    owner: root
    group: kibana
    mode: "0660"

- name: Restart Kibana
  ansible.builtin.service:
    name: kibana
    state: restarted

- name: Wait for Kibana to answer ({{ kibana_port }})
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/status"
    user: "kibana_system"
    password: "{{ kibana_system_password }}"
    status_code: [200]
  register: kbn_status
  until: kbn_status.status == 200
  retries: 30
  delay: 10
  timeout: 30

# Create the Fleet agent policy (idempotent by name) then an enrollment token for it.
# The policy is preconfigured in kibana.yml (system package / EDR), we fetch its id.
- name: Fetch agent policy id ({{ fleet_policy_name }})
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/fleet/agent_policies"
    method: GET
    user: "kibana_system"
    password: "{{ kibana_system_password }}"
    headers:
      kbn-xsrf: "true"
    return_content: yes
  register: policies
  until: policies.status == 200 and ( (policies.json['list'] | default(policies.json['items'] | default([]))) | selectattr('name', 'equalto', fleet_policy_name) | list | length) > 0
  retries: 15
  delay: 5
  timeout: 30

- name: Set fact policy id (tolerant to list/items response key)
  ansible.builtin.set_fact:
    policy_id: "{{ (policies.json['list'] | default(policies.json['items'] | default([]))) | selectattr('name', 'equalto', fleet_policy_name) | map(attribute='id') | first }}"

# The EDR engine (the "endpoint" / Elastic Defend integration) and the "windows"
# integration (Sysmon / PowerShell / Defender winlog) cannot be preconfigured in
# kibana.yml, so they are attached to the policy through the Fleet API. Creating
# a package policy auto-installs the package in the registry if it is missing
# (ensureInstalledPackage); xpack.fleet.packages (kibana.yml) preinstalls them at
# boot as the offline fast-path. We only need to fetch the latest package version
# to pass in the policy payload.

- name: Set Kibana version fact
  ansible.builtin.set_fact:
    kbn_version: "{{ kbn_status.json.version.number | default('') }}"

# ---------------------------------------------------------------------------
# Dedicated Fleet Server (control plane on :8220)
# Same pattern as BSL / LME / elastic-container: the single elastic-agent on
# this VM runs the fleet-server subprocess, enrolled in the preconfigured
# fleet-server-policy. Other agents enroll at https://<vm>:8220 --insecure.
# ---------------------------------------------------------------------------

# Single-node cluster : avoid perpetual yellow (unassigned replica shards) on
# the fleet / logs / metrics indices (cisagov/LME pattern).
- name: Set number_of_replicas to 0 (single node)
  ansible.builtin.uri:
    url: "http://localhost:{{ es_http_port }}/_settings"
    method: PUT
    user: "elastic"
    password: "{{ elastic_password }}"
    headers:
      Content-Type: "application/json"
    body_format: json
    body:
      index:
        number_of_replicas: 0
  register: es_replicas
  until: es_replicas.status == 200
  retries: 5
  delay: 5
  changed_when: false

# ---------------------------------------------------------------------------
# Data retention (ILM): without an expiry the observation lab floods the 80GB
# single node in a few weeks (GBs/day from Sysmon + full winlog + 4688-cmdline
# + Defend) and the cluster goes read-only mid-hunt. Minimal policy: delete
# everything in logs-*/metrics-* after elastic_ilm_retention_days. Both PUTs
# are idempotent (full replacement semantics), safe on re-runs.
# ---------------------------------------------------------------------------
- name: Install the goad-edr-logs ILM policy (delete after retention window)
  ansible.builtin.uri:
    url: "http://localhost:{{ es_http_port }}/_ilm/policy/goad-edr-logs"
    method: PUT
    user: "elastic"
    password: "{{ elastic_password }}"
    headers:
      Content-Type: "application/json"
    body_format: json
    body:
      policy:
        phases:
          delete:
            min_age: "{{ elastic_ilm_retention_days }}d"
            actions:
              delete: {}
  register: es_ilm_policy
  until: es_ilm_policy.status == 200
  retries: 5
  delay: 5
  changed_when: false

# Do not create a broad logs-*/metrics-* index template here. Fleet-owned
# integration templates carry their mappings, pipelines and data-stream setup.
# The ILM policy is attached through the logs@custom / metrics@custom component
# templates after Fleet integrations have installed those customization hooks.

- name: Init Fleet setup (creates indices / default output scaffolding)
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/fleet/setup"
    method: POST
    user: "elastic"
    password: "{{ elastic_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
      kbn-xsrf: "true"
    body_format: json
    body: {}
  register: fleet_setup
  status_code: [200, 400]
  until: fleet_setup.status in [200, 400]
  failed_when: >-
    fleet_setup.status not in [200, 400] or
    (fleet_setup.status == 400 and
     (fleet_setup.json.message | default('')) is not search('(?i)already|initialized'))
  retries: 10
  delay: 5
  timeout: 30

- name: Wait for the Fleet Server policy ({{ fleet_server_policy_name }})
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/fleet/agent_policies"
    method: GET
    user: "kibana_system"
    password: "{{ kibana_system_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
      kbn-xsrf: "true"
    return_content: yes
  register: fs_policies
  until: fs_policies.status == 200 and ( (fs_policies.json['list'] | default(fs_policies.json['items'] | default([]))) | selectattr('name', 'equalto', fleet_server_policy_name) | list | length) > 0
  retries: 15
  delay: 5
  timeout: 30

- name: Set fact fleet server policy id
  ansible.builtin.set_fact:
    fs_policy_id: "{{ (fs_policies.json['list'] | default(fs_policies.json['items'] | default([]))) | selectattr('name', 'equalto', fleet_server_policy_name) | map(attribute='id') | first }}"

# Two DISTINCT credentials for the Fleet Server agent :
#   - the ES service token (fleet-server -> Elasticsearch communication)
#   - the enrollment API key of fleet-server-policy (agent -> Fleet enrollment)
- name: Generate Fleet Server ES service token
  ansible.builtin.uri:
    url: "http://localhost:{{ es_http_port }}/_security/service/elastic/fleet-server/credential/token/{{ fleet_server_service_token_name }}"
    method: POST
    user: "elastic"
    password: "{{ elastic_password }}"
    body_format: json
    body: {}
  no_log: true
  register: fs_service_token
  until: fs_service_token.status == 200
  retries: 5
  delay: 5

- name: Set fact fleet server service token
  ansible.builtin.set_fact:
    fleet_server_service_token: "{{ fs_service_token.json.token.value }}"
  no_log: true

- name: List existing enrollment tokens
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/fleet/enrollment_api_keys"
    method: GET
    user: "kibana_system"
    password: "{{ kibana_system_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
      kbn-xsrf: "true"
    return_content: yes
  register: tokens_all
  until: tokens_all.status == 200
  retries: 5
  delay: 3
  timeout: 30

- name: Set fact fleet server token present
  ansible.builtin.set_fact:
    fs_token_present: "{{ tokens_all.json['items'] | selectattr('name', 'equalto', fleet_server_enrollment_token_name) | list | length > 0 }}"

- name: Create enrollment token for the Fleet Server policy
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/fleet/enrollment_api_keys"
    method: POST
    user: "kibana_system"
    password: "{{ kibana_system_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
      kbn-xsrf: "true"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ fleet_server_enrollment_token_name }}"
      policy_id: "{{ fs_policy_id }}"
  no_log: true
  register: fs_create_token
  when: not fs_token_present

- name: Set fact fleet server enrollment token
  ansible.builtin.set_fact:
    fs_enrollment_token: >-
      {{ (fs_create_token.json.item.api_key | default(''))
         if (not fs_token_present)
         else (tokens_all.json['items'] | selectattr('name', 'equalto', fleet_server_enrollment_token_name) | map(attribute='api_key') | first) }}
  no_log: true

- name: Check if the Fleet Server agent is already installed
  ansible.builtin.stat:
    path: /opt/Elastic/elastic-agent/elastic-agent
  register: fs_agent_installed

# Fleet Server : downloads the linux agent, installs + enrolls it into the
# fleet-server-policy. With no --fleet-server-cert* flags the agent auto-generates
# a self-signed certificate and serves https://<vm>:8220 (its own bootstrap
# enrollment runs over the internal localhost:8221 endpoint, CA auto-injected).
- name: Download the Linux Elastic Agent ({{ elastic_agent_linux_version }})
  ansible.builtin.get_url:
    url: "{{ elastic_agent_linux_url }}"
    dest: "/tmp/elastic-agent-{{ elastic_agent_linux_version }}-linux-x86_64.tar.gz"
    mode: "0644"
  register: fs_download
  until: fs_download is succeeded
  retries: 3
  delay: 10
  when: not fs_agent_installed.stat.exists

- name: Extract the Linux Elastic Agent
  ansible.builtin.unarchive:
    src: "/tmp/elastic-agent-{{ elastic_agent_linux_version }}-linux-x86_64.tar.gz"
    dest: /tmp
    remote_src: true
  when: not fs_agent_installed.stat.exists

- name: Install and enroll the Fleet Server agent
  ansible.builtin.command: >-
    /tmp/elastic-agent-{{ elastic_agent_linux_version }}-linux-x86_64/elastic-agent install
    --url=https://localhost:{{ fleet_server_port }}
    --insecure
    --enrollment-token={{ fs_enrollment_token }}
    --fleet-server-es=http://127.0.0.1:{{ es_http_port }}
    --fleet-server-service-token={{ fleet_server_service_token }}
    --fleet-server-policy={{ fleet_server_policy_id }}
    --fleet-server-host=0.0.0.0
    --fleet-server-port={{ fleet_server_port }}
    --force --non-interactive
  register: fs_install
  # --url semantics (#28): Elastic defines --url as "Fleet Server URL to use to
  # enroll the Elastic Agent into Fleet" (8.19 command reference,
  # https://www.elastic.co/guide/en/fleet/8.19/elastic-agent-cmd-options.html,
  # fetched this session; the documented "set up Fleet Server" example passes
  # --url=https://fleet-server:8220 - the Fleet Server's OWN listener, not
  # Kibana). During bootstrap the enrolling agent IS this same host, so the
  # URL points at the local Fleet Server listener this command creates
  # (https://localhost:8220). With no --fleet-server-cert* flags the agent
  # auto-generates a self-signed certificate, and per the same docs page
  # "Remote Elastic Agents enrolling into a Fleet Server with self-signed
  # certificates must specify the --insecure flag" - --insecure is therefore
  # mandatory for this self-enrollment. Whether the previous
  # --url=http://localhost:5601 (Kibana) form also works live is UNPROVEN;
  # both forms are recorded in ISSUE-EVIDENCE.md for the live run to settle.
  # Command line carries --fleet-server-service-token / --enrollment-token
  # (visible in ps + logs on the host otherwise) - #33.
  no_log: true
  when: not fs_agent_installed.stat.exists
  failed_when: fs_install.rc != 0

# fs_install is no_log'd, so its output is hidden even on failure - surface WHY
# bootstrap failed from the agent's own log (installation-layout: data dir holds
# elastic-agent-*/logs/elastic-agent.ndjson) before the play dies.
- name: "Diagnose Fleet Server bootstrap failure (#28/#33 - fs_install output is no_log'd)"
  ansible.builtin.command: journalctl -u elastic-agent -n 40 --no-pager
  changed_when: false
  failed_when: false
  register: fs_bootstrap_logs
  when: fs_install.rc | default(0) != 0

- name: Report Fleet Server bootstrap failure with agent log tail
  ansible.builtin.fail:
    msg: >-
      Fleet Server install/enroll failed (rc={{ fs_install.rc | default('?') }}).
      The install command output is no_log'd (token-bearing command line, #33).
      Agent service log tail:
      {{ fs_bootstrap_logs.stdout | default('unavailable - elastic-agent service may not exist yet; check /opt/Elastic/Agent/data/elastic-agent-*/logs/elastic-agent.ndjson manually') }}
  when: fs_install.rc | default(0) != 0

- name: Wait for the Fleet Server to listen ({{ fleet_server_port }})
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ fleet_server_port }}"
    state: started
    delay: 5
    timeout: 300

# ansible.builtin.service has NO start_mode parameter (that belongs to
# ansible.windows.win_service; fetched docs this session:
# https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/service_module.html
# - the builtin module's boot-time enablement param is `enabled: boolean`).
# start_mode: auto here would fail module-arg validation on first run.
- name: Ensure the elastic-agent service is running and enabled
  ansible.builtin.service:
    name: elastic-agent
    state: started
    enabled: true

# Register the Fleet Server host (LAN IP, NOT 127.0.0.1) so the Fleet UI shows it
# and every agent policy defaults to it (elastic-container / LME pattern).
- name: Set fact fleet server host url (the VM's real IP)
  ansible.builtin.set_fact:
    fleet_server_host_url: "https://{{ hostvars[inventory_hostname].ansible_host }}:{{ fleet_server_port }}"

- name: List registered Fleet Server hosts
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/fleet/fleet_server_hosts"
    method: GET
    user: "kibana_system"
    password: "{{ kibana_system_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
      kbn-xsrf: "true"
    return_content: yes
  register: fs_hosts
  until: fs_hosts.status == 200
  retries: 5
  delay: 3
  timeout: 30

- name: Set fact fleet server host registered
  ansible.builtin.set_fact:
    fs_host_registered: "{{ fs_hosts.json['items'] | default([]) | selectattr('host_urls', 'defined') | selectattr('host_urls', 'search', '://' ~ hostvars[inventory_hostname].ansible_host ~ ':' ~ fleet_server_port) | list | length > 0 }}"

- name: Register the Fleet Server host in Fleet
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/fleet/fleet_server_hosts"
    method: POST
    user: "kibana_system"
    password: "{{ kibana_system_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
      kbn-xsrf: "true"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "goad-fleet-server"
      host_urls:
        - "{{ fleet_server_host_url }}"
      is_default: true
  register: fs_host_reg
  until: fs_host_reg.status == 200
  retries: 5
  delay: 5
  timeout: 30
  when: not fs_host_registered


# Data plane : enrolled (remote) agents write events to Elasticsearch through the
# Fleet "default" output. That output is created the first time Kibana starts
# (during the apt install, before this role's kibana.yml is written) with the
# hardcoded http://localhost:9200 and is NOT rewritten on re-runs. Point it at
# the VM's real IP so the remote Windows agents reach Elasticsearch (localhost is
# wrong from their perspective). xpack.fleet.agents.elasticsearch.hosts in
# kibana.yml covers a brand-new output; this also fixes an existing one.
- name: Set fact target ES output url (the VM's real IP, for remote agents)
  ansible.builtin.set_fact:
    es_output_url: "http://{{ hostvars[inventory_hostname].ansible_host }}:{{ es_http_port }}"

- name: Get the Fleet default output
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/fleet/outputs/fleet-default-output"
    method: GET
    user: "kibana_system"
    password: "{{ kibana_system_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
      kbn-xsrf: "true"
    return_content: yes
  register: default_output
  until: default_output.status == 200
  retries: 10
  delay: 5
  timeout: 30

- name: Point the Fleet default output at the VM (so remote agents reach ES)
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/fleet/outputs/fleet-default-output"
    method: PUT
    user: "kibana_system"
    password: "{{ kibana_system_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
      kbn-xsrf: "true"
      Content-Type: "application/json"
    body_format: json
    body:
      type: "elasticsearch"
      hosts:
        - "{{ es_output_url }}"
  register: set_default_output
  until: set_default_output.status == 200
  retries: 5
  delay: 5
  timeout: 30
  when: (default_output.json.item.hosts | default(['']) | list) != [es_output_url]

- name: Fetch endpoint (Elastic Defend) package version
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/fleet/epm/packages/endpoint"
    method: GET
    user: "kibana_system"
    password: "{{ kibana_system_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
      kbn-xsrf: "true"
    return_content: yes
  register: endpoint_pkg
  until: endpoint_pkg.status == 200
  retries: 10
  delay: 10
  timeout: 30

- name: Set fact endpoint package version
  ansible.builtin.set_fact:
    endpoint_package_version: "{{ endpoint_pkg.json.item.latestVersion | default(endpoint_pkg.json.item.version) }}"

- name: Fetch windows package version
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/fleet/epm/packages/windows"
    method: GET
    user: "kibana_system"
    password: "{{ kibana_system_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
      kbn-xsrf: "true"
    return_content: yes
  register: windows_pkg
  until: windows_pkg.status == 200
  retries: 10
  delay: 10
  timeout: 30

- name: Set fact windows package version
  ansible.builtin.set_fact:
    windows_package_version: "{{ windows_pkg.json.item.latestVersion | default(windows_pkg.json.item.version) }}"

# GET /api/fleet/package_policies has no ?policy_id= filter on 8.x (unknown query
# keys are rejected), so we list everything and filter locally for idempotency.
- name: List package policies
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/fleet/package_policies"
    method: GET
    user: "kibana_system"
    password: "{{ kibana_system_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
      kbn-xsrf: "true"
    return_content: yes
  register: package_policies
  until: package_policies.status == 200
  retries: 5
  delay: 3
  timeout: 30

- name: Set fact package policy names on the EDR policy
  ansible.builtin.set_fact:
    pp_names: >-
      {{ (package_policies.json['items'] | default([]))
         | selectattr('policy_id', 'defined')
         | selectattr('policy_id', 'equalto', policy_id)
         | map(attribute='name') | list }}

# Elastic Defend engine : the "endpoint" integration, EDRComplete preset.
# (official "Create an Elastic Defend policy using the API" payload shape)
- name: Create Elastic Defend (endpoint) package policy - {{ edr_preset }}
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/fleet/package_policies"
    method: POST
    user: "kibana_system"
    password: "{{ kibana_system_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
      kbn-xsrf: "true"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ endpoint_policy_name }}"
      description: "GOAD elastic-edr - Elastic Defend engine ({{ edr_preset }} preset)"
      namespace: "default"
      policy_id: "{{ policy_id }}"
      enabled: true
      inputs:
        - enabled: true
          streams: []
          type: "ENDPOINT_INTEGRATION_CONFIG"
          config:
            _config:
              value:
                type: "endpoint"
                endpointConfig:
                  preset: "{{ edr_preset }}"
      package:
        name: "endpoint"
        title: "Elastic Defend"
        version: "{{ endpoint_package_version }}"
  register: endpoint_policy
  status_code: [200, 409]
  until: endpoint_policy.status in [200, 409]
  retries: 5
  delay: 5
  timeout: 60
  when: endpoint_policy_name not in pp_names

# Windows integration : winlog streams (battle-tested lab set, BSL / NetExec-Lab)
# plus Windows Defender. Sysmon feeds windows.sysmon_operational; AppLocker and
# forwarded add detection coverage. The optional windows-metrics input (perfmon/
# service) is intentionally omitted from the default policy to limit volume.
- name: Create windows package policy (Sysmon / PowerShell / Defender / AppLocker)
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/fleet/package_policies"
    method: POST
    user: "kibana_system"
    password: "{{ kibana_system_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
      kbn-xsrf: "true"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ windows_policy_name }}"
      description: "GOAD elastic-edr - Sysmon / PowerShell / Defender / AppLocker winlog"
      namespace: "default"
      policy_id: "{{ policy_id }}"
      vars: {}
      inputs:
        windows-winlog:
          enabled: true
          streams:
            windows.sysmon_operational:
              enabled: true
            windows.powershell:
              enabled: true
            windows.powershell_operational:
              enabled: true
            windows.windows_defender:
              enabled: true
            windows.applocker_exe_and_dll:
              enabled: true
            windows.applocker_msi_and_script:
              enabled: true
            windows.applocker_packaged_app_deployment:
              enabled: true
            windows.applocker_packaged_app_execution:
              enabled: true
            windows.forwarded:
              enabled: true
      package:
        name: "windows"
        version: "{{ windows_package_version }}"
  register: windows_policy
  status_code: [200, 409]
  until: windows_policy.status in [200, 409]
  retries: 5
  delay: 5
  timeout: 60
  when: windows_policy_name not in pp_names

- name: Fail if the EDR engine policy is not attached
  ansible.builtin.fail:
    msg: "The endpoint (Elastic Defend) package policy could not be attached to {{ fleet_policy_name }} (status {{ endpoint_policy.status | default('skipped') }})."
  when:
    - endpoint_policy_name not in pp_names
    - endpoint_policy is defined
    - endpoint_policy.status not in [200, 409]

# Use Fleet's custom component-template hooks rather than a generic index template
# that competes with integration-managed templates. Preserve any existing custom
# settings/mappings/metadata when adding the lifecycle setting.
#
# #31 - zero replicas for FUTURE backing indices: PUT /_settings mutates only
# indices existing at that moment, so new/rolled Fleet backing indices would
# still inherit the integration templates' number_of_replicas: 1 and sit
# unassigned (yellow) on this single node. The fix rides the SAME logs@custom /
# metrics@custom component templates the ILM policy uses: settings composed
# through a component template are inherited by every new backing index that
# resolves through the Fleet integration index templates (ES 8.19 semantics,
# fetched this session:
# https://www.elastic.co/guide/en/elasticsearch/reference/8.19/index-templates.html -
# "component templates are a building block ... a new index created from a
# template inherits the settings, mappings and aliases from the index template
# AND its component templates"; template-level settings win over component-
# template settings, so a matching Fleet template that explicitly sets
# number_of_replicas would take precedence - verify the effective value on the
# live run via GET logs-*/_settings).
- name: Fetch existing logs custom component template
  ansible.builtin.uri:
    url: "http://localhost:{{ es_http_port }}/_component_template/logs@custom"
    method: GET
    user: "elastic"
    password: "{{ elastic_password }}"
    status_code: [200, 404]
    return_content: yes
  register: es_logs_custom_existing

- name: Fetch existing metrics custom component template
  ansible.builtin.uri:
    url: "http://localhost:{{ es_http_port }}/_component_template/metrics@custom"
    method: GET
    user: "elastic"
    password: "{{ elastic_password }}"
    status_code: [200, 404]
    return_content: yes
  register: es_metrics_custom_existing

- name: Preserve existing logs custom component template content
  ansible.builtin.set_fact:
    es_logs_custom_body: "{{ (es_logs_custom_existing.json.component_templates | default([]) | first | default({})).component_template | default({}) }}"

- name: Preserve existing metrics custom component template content
  ansible.builtin.set_fact:
    es_metrics_custom_body: "{{ (es_metrics_custom_existing.json.component_templates | default([]) | first | default({})).component_template | default({}) }}"

- name: Add ILM settings to the logs custom component template
  ansible.builtin.uri:
    url: "http://localhost:{{ es_http_port }}/_component_template/logs@custom"
    method: PUT
    user: "elastic"
    password: "{{ elastic_password }}"
    headers:
      Content-Type: "application/json"
    body_format: json
    body: "{{ es_logs_custom_body | combine({'template': (es_logs_custom_body.get('template', {}) | combine({'settings': (es_logs_custom_body.get('template', {}).get('settings', {}) | combine({'index.lifecycle.name': 'goad-edr-logs', 'index.number_of_replicas': 0}, recursive=True))}, recursive=True))}, recursive=True) | to_json }}"
  register: es_logs_custom_put
  until: es_logs_custom_put.status == 200
  retries: 5
  delay: 5
  changed_when: false

- name: Add ILM settings to the metrics custom component template
  ansible.builtin.uri:
    url: "http://localhost:{{ es_http_port }}/_component_template/metrics@custom"
    method: PUT
    user: "elastic"
    password: "{{ elastic_password }}"
    headers:
      Content-Type: "application/json"
    body_format: json
    body: "{{ es_metrics_custom_body | combine({'template': (es_metrics_custom_body.get('template', {}) | combine({'settings': (es_metrics_custom_body.get('template', {}).get('settings', {}) | combine({'index.lifecycle.name': 'goad-edr-logs', 'index.number_of_replicas': 0}, recursive=True))}, recursive=True))}, recursive=True) | to_json }}"
  register: es_metrics_custom_put
  until: es_metrics_custom_put.status == 200
  retries: 5
  delay: 5
  changed_when: false

# Apply the policy to already-created data streams/backing indices as well;
# component-template changes alone only affect future backing indices.
- name: Apply ILM and zero-replica settings to existing logs and metrics data streams
  ansible.builtin.uri:
    url: "http://localhost:{{ es_http_port }}/logs-*,metrics-*/_settings?allow_no_indices=true&ignore_unavailable=true&expand_wildcards=all"
    method: PUT
    user: "elastic"
    password: "{{ elastic_password }}"
    headers:
      Content-Type: "application/json"
    body_format: json
    body:
      index.lifecycle.name: goad-edr-logs
      index.number_of_replicas: 0
    status_code: [200, 404]
    return_content: yes
  register: es_ilm_existing_settings
  failed_when: es_ilm_existing_settings.status not in [200, 404]
  changed_when: false

# Flip the Defend engine to DETECT-ONLY mode. The EDRComplete preset defaults the
# protections to PREVENT, which would block test payloads (EICAR / ransomware
# drops / mimikatz) before they can be observed - useless for a purple-team range.
# Every battle-tested red-team lab (BSL/NetExec-Lab "Ludus - X protection", LME,
# jadu101) pushes this explicit policy right after creating the integration:
#   malware / ransomware / memory / behavior -> mode: detect
#   all 8 Windows event categories on, antivirus_registration on,
#   credential_hardening off, popup banners on so operators see detections.
- name: Set fact Elastic Defend policy id
  ansible.builtin.set_fact:
    endpoint_policy_id: "{{ endpoint_policy.json.item.id }}"
  when:
    - endpoint_policy is defined
    - endpoint_policy.status in [200, 409]
    - endpoint_policy.json.item.id is defined

- name: Set Elastic Defend engine to detect-only mode (purple team)
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/fleet/package_policies/{{ endpoint_policy_id }}"
    method: PUT
    user: "kibana_system"
    password: "{{ kibana_system_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
      kbn-xsrf: "true"
      Content-Type: "application/json"
    body_format: json
    timeout: 120
    body:
      name: "{{ endpoint_policy_name }}"
      namespace: "default"
      policy_id: "{{ policy_id }}"
      enabled: true
      inputs:
        - enabled: true
          streams: []
          type: "ENDPOINT_INTEGRATION_CONFIG"
          config:
            _config:
              value:
                type: "endpoint"
                endpointConfig:
                  preset: "{{ edr_preset }}"
                  policy:
                    value:
                      windows:
                        events:
                          credential_access: true
                          dll_and_driver_load: true
                          dns: true
                          file: true
                          network: true
                          process: true
                          registry: true
                          security: true
                        malware:
                          mode: "detect"
                          blocklist: false
                        ransomware:
                          mode: "detect"
                          supported: true
                        memory_protection:
                          mode: "detect"
                          supported: true
                        behavior_protection:
                          mode: "detect"
                          reputation_service: true
                          supported: true
                        popup:
                          malware:
                            message: "GOAD - malware protection (detect)"
                            enabled: true
                          ransomware:
                            message: "GOAD - ransomware protection (detect)"
                            enabled: true
                          memory_protection:
                            message: "GOAD - memory protection (detect)"
                            enabled: true
                          behavior_protection:
                            message: "GOAD - behavior protection (detect)"
                            enabled: true
                        logging:
                          file: "info"
                        antivirus_registration:
                          enabled: true
                        attack_surface_reduction:
                          credential_hardening:
                            enabled: false
                      mac:
                        events:
                          process: true
                          file: true
                          network: true
                        malware:
                          mode: "detect"
                          blocklist: true
                        memory_protection:
                          mode: "detect"
                          supported: true
                        behavior_protection:
                          mode: "detect"
                          reputation_service: false
                          supported: true
                      linux:
                        events:
                          process: true
                          file: true
                          network: true
                          session_data: true
                          tty_io: false
                        malware:
                          mode: "detect"
                          blocklist: true
                        memory_protection:
                          mode: "detect"
                          supported: true
                        behavior_protection:
                          mode: "detect"
                          reputation_service: false
                          supported: true
      version: "{{ endpoint_package_version }}"
      force: true
  register: endpoint_detect
  status_code: [200, 409]
  until: endpoint_detect.status in [200, 409]
  retries: 5
  delay: 5
  when: endpoint_policy_id is defined

- name: Fail if the Defend engine detect-mode update failed
  ansible.builtin.fail:
    msg: "Could not set the Elastic Defend engine to detect-only mode (status {{ endpoint_detect.status | default('skipped') }})."
  when:
    - endpoint_policy_id is defined
    - endpoint_detect is defined
    - endpoint_detect.status not in [200, 409]

# Detection engine : attack -> alert loop.
# 3-step sequence from peasead/elastic-container (the battle-tested lab base):
# 1. enable the engine (creates the alerts indices)
# 2. install the prepackaged (built-in SIEM) rules - NOT auto-installed on a
#    fresh self-managed install (verified in the 8.19 source)
# 3. bulk-enable the rules matching Windows (fresh installs ship them disabled)
# Idempotent: step 2 returns 200 {rules_installed:0,...} on re-runs.
- name: Enable the detection engine
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/detection_engine/index"
    method: POST
    user: "elastic"
    password: "{{ elastic_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
      kbn-xsrf: "true"
    body_format: json
    body: {}
  register: de_enable
  status_code: [200, 400]
  until: de_enable.status in [200, 400]
  failed_when: >-
    de_enable.status not in [200, 400] or
    (de_enable.status == 400 and
     (de_enable.json.message | default('')) is not search('(?i)already|initialized'))
  retries: 10
  delay: 5
  timeout: 60

- name: Install prepackaged (built-in SIEM) detection rules
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/detection_engine/rules/prepackaged"
    method: PUT
    user: "elastic"
    password: "{{ elastic_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
      kbn-xsrf: "true"
      Content-Type: "application/json"
    body_format: json
    body: {}
  register: de_prepackaged
  until: de_prepackaged.status == 200
  retries: 10
  delay: 10
  timeout: 600
  changed_when: (de_prepackaged.json.rules_installed | default(0)) | int > 0

- name: Assert prepackaged detection rules installed
  ansible.builtin.assert:
    that:
      - de_prepackaged.status == 200
      - de_prepackaged.json.rules_installed is defined
      - de_prepackaged.json.rules_updated is defined
    fail_msg: "Prepackaged detection rules install failed (status {{ de_prepackaged.status | default('n/a') }})."
    success_msg: >-
      Prepackaged rules: installed={{ de_prepackaged.json.rules_installed | default(0) }}
      updated={{ de_prepackaged.json.rules_updated | default(0) }}
      (ML rules are skipped on the Basic license)

# Prepackaged rules posture : configurable enable/disable with transition
# detection. The posture is applied on FIRST run, and on later runs only when
# the flag CHANGES vs the stored posture - so per-rule enable/disable toggles
# made in the Kibana UI survive re-provisions. Transition table:
#   stored absent + flag true  -> bulk-enable  (first run, default posture)
#   stored absent + flag false -> no bulk action (rules stay dormant)
#   stored == flag             -> no-op (learner UI toggles survive)
#   stored != flag             -> transition: bulk-enable or bulk-disable
# Scope of the bulk actions: ONLY prepackaged (Elastic-managed) rules, via the
# alert.attributes.params.immutable: true discriminator - the same field the
# Kibana Rules UI uses for its "Elastic rules" filter (verified in the 8.19.23
# source: rule_management/rule_fields.ts, PARAMS_IMMUTABLE_FIELD; prepackaged
# rules are immutable, hand-authored rules are mutable and are NEVER touched
# by a posture flip).
- name: Check for stored prepackaged-rules posture
  ansible.builtin.stat:
    path: "{{ state_dir }}/prepackaged-rules-state"
  register: pr_state_file

- name: Read stored prepackaged-rules posture
  ansible.builtin.slurp:
    src: "{{ state_dir }}/prepackaged-rules-state"
  register: pr_state_stored
  when: pr_state_file.stat.exists

- name: Compute prepackaged-rules posture transitions
  ansible.builtin.set_fact:
    pr_do_enable: >-
      {{ ((not pr_state_file.stat.exists) and (prepackaged_rules_enabled | bool))
         or (pr_state_file.stat.exists
             and pr_stored == 'false'
             and (prepackaged_rules_enabled | bool)) }}
    pr_do_disable: >-
      {{ (pr_state_file.stat.exists
          and pr_stored == 'true'
          and not (prepackaged_rules_enabled | bool)) }}
  vars:
    # Task-scoped decode of the stored posture: a single decode point, and
    # it must NOT go through set_fact persistence - set_fact coerces the
    # string 'true' into a native boolean, which would break the 'true'/
    # 'false' string comparisons here (verified on ansible-core 2.18).
    pr_stored: "{{ (pr_state_stored.content | b64decode | trim)
                   if (pr_state_file.stat.exists | default(false)) else 'none' }}"

- name: Enable ALL prepackaged detection rules (transition to enabled posture)
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/detection_engine/rules/_bulk_action"
    method: POST
    user: "elastic"
    password: "{{ elastic_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
      kbn-xsrf: "true"
      Content-Type: "application/json"
    body_format: json
    body:
      # alert.attributes.params.immutable: true = exactly the prepackaged
      # (Elastic-managed) rule corpus, every platform; hand-authored rules
      # (immutable: false) are untouched. Verified against the Kibana 8.19.23
      # rule-management source (PARAMS_IMMUTABLE_FIELD / KQL_FILTER_IMMUTABLE_RULES).
      query: 'alert.attributes.params.immutable: true'
      action: "enable"
  register: de_bulk_enable
  status_code: [200, 400]
  until: de_bulk_enable.status in [200, 400]
  failed_when: >-
    de_bulk_enable.status not in [200, 400] or
    (de_bulk_enable.status == 400 and
     (de_bulk_enable.json.message | default('')) is not search('(?i)already|initialized'))
  retries: 10
  delay: 5
  timeout: 300
  when: pr_do_enable | bool

- name: Disable ALL prepackaged detection rules (transition to solo-hunting posture)
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/detection_engine/rules/_bulk_action"
    method: POST
    user: "elastic"
    password: "{{ elastic_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
      kbn-xsrf: "true"
      Content-Type: "application/json"
    body_format: json
    body:
      query: 'alert.attributes.params.immutable: true'
      action: "disable"
  register: de_bulk_disable
  status_code: [200, 400]
  until: de_bulk_disable.status in [200, 400]
  failed_when: >-
    de_bulk_disable.status not in [200, 400] or
    (de_bulk_disable.status == 400 and
     (de_bulk_disable.json.message | default('')) is not search('(?i)already|initialized'))
  retries: 10
  delay: 5
  timeout: 300
  when: pr_do_disable | bool

- name: Verify effective rule posture after bulk action (#23)
  ansible.builtin.uri:
    # Read-after-write check: query the immutable (prepackaged) rules and
    # require at least one rule in the TARGETED enabled-state. Response shape
    # and filter syntax verified against the Kibana 8.19.23 API source
    # (find_rules_route.gen.ts: FindRulesResponse = { page, perPage, total,
    # data }; filter uses alert.attributes.<field>:<value> KQL -
    # alert.attributes.enabled / alert.attributes.params.immutable per
    # common/detection_engine/rule_management/rule_fields.ts, the same fields
    # the Rules UI's KQL_FILTER_IMMUTABLE_RULES / KQL_FILTER_ENABLED_RULES
    # / KQL_FILTER_DISABLED_RULES constants are built from).
    url: "http://localhost:{{ kibana_port }}/api/detection_engine/rules/_find?page=1&per_page=1&filter={{ (('alert.attributes.params.immutable: true and alert.attributes.enabled: true') if (prepackaged_rules_enabled | bool) else ('alert.attributes.params.immutable: true and alert.attributes.enabled: false')) | urlencode }}"
    method: GET
    user: "elastic"
    password: "{{ elastic_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
    return_content: yes
    status_code: [200]
  register: pr_effective
  until: pr_effective.status == 200
  retries: 5
  delay: 5
  timeout: 60
  when: (pr_do_enable | default(false)) | bool or (pr_do_disable | default(false)) | bool

- name: Fail if the bulk posture transition did not take effect (#23)
  ansible.builtin.fail:
    msg: >-
      The prepackaged-rule bulk action reported success but the effective
      posture check found NO prepackaged rules in the targeted enabled-state
      ({{ 'enabled' if (prepackaged_rules_enabled | bool) else 'disabled' }}).
      The posture marker was NOT written - the transition must be re-run.
      Bulk response: {{ (de_bulk_enable.json if (pr_do_enable | default(false)) | bool else de_bulk_disable.json) | default({}) | to_nice_json | truncate(600) }}
      Find response: {{ pr_effective.json | default({}) | to_nice_json | truncate(300) }}
  when:
    - (pr_do_enable | default(false)) | bool or (pr_do_disable | default(false)) | bool
    - pr_effective.json.total | default(0) | int == 0

- name: Persist the prepackaged-rules posture
  ansible.builtin.copy:
    # Explicit bool-to-string (no bool|lower chain): renders exactly
    # 'true'/'false', which is what the transition facts compare against.
    # Persisted ONLY after the effective-state verification above passed
    # (#23): no transition this run -> always persist; transition this run
    # -> only after the _find read-back found >= 1 rule in the targeted
    # enabled-state. A failed/empty transition leaves the marker unwritten,
    # so the next provision re-runs the transition (correct retry loop).
    content: "{{ 'true' if (prepackaged_rules_enabled | bool) else 'false' }}"
    dest: "{{ state_dir }}/prepackaged-rules-state"
    mode: "0640"
    owner: root
    group: root

# Create a dedicated enrollment token bound to the policy (only if none exists yet).
# NOTE: the 8.19 schema is { name?, policy_id, expiration? } - the field is
# policy_id (agent_policy_id is rejected by the schema validation).
- name: List existing enrollment tokens
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/fleet/enrollment_api_keys"
    method: GET
    user: "kibana_system"
    password: "{{ kibana_system_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
      kbn-xsrf: "true"
    return_content: yes
  register: tokens
  until: tokens.status == 200
  retries: 5
  delay: 3
  timeout: 30

- name: Set fact existing token name present
  ansible.builtin.set_fact:
    token_present: "{{ tokens.json['items'] | selectattr('name', 'equalto', enrollment_token_name) | list | length > 0 }}"

- name: Create enrollment token for the EDR policy
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/fleet/enrollment_api_keys"
    method: POST
    user: "kibana_system"
    password: "{{ kibana_system_password }}"
    headers:
      kbn-version: "{{ kbn_version }}"
      kbn-xsrf: "true"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ enrollment_token_name }}"
      policy_id: "{{ policy_id }}"
  no_log: true
  register: create_token
  when: not token_present

- name: Set fact enrollment token value
  ansible.builtin.set_fact:
    enrollment_token: >-
      {{ (create_token.json.item.api_key | default(''))
         if (not token_present)
         else (tokens.json['items'] | selectattr('name', 'equalto', enrollment_token_name) | map(attribute='api_key') | first) }}
  no_log: true

- name: Persist enrollment token for the windows agent play
  ansible.builtin.copy:
    content: "{{ enrollment_token }}"
    dest: "{{ state_dir }}/enrollment-token"
    mode: "0640"
    owner: root
    group: root

- name: Persist stack credentials for the windows agent play
  ansible.builtin.copy:
    dest: "{{ state_dir }}/stack.env"
    mode: "0640"
    owner: root
    group: root
    content: |
      ELASTIC_HOST={{ hostvars[inventory_hostname].ansible_host }}
      KIBANA_PORT={{ kibana_port }}
      ES_PASSWORD={{ elastic_password }}
      KIBANA_SYSTEM_PASSWORD={{ kibana_system_password }}

- name: Show EDR access info
  ansible.builtin.debug:
    msg: |
      Kibana / Fleet  : http://{{ hostvars[inventory_hostname].ansible_host }}:{{ kibana_port }}
      Elasticsearch   : http://{{ hostvars[inventory_hostname].ansible_host }}:{{ es_http_port }}
      Fleet Server    : {{ fleet_server_host_url }} (control plane, self-signed https)
      elastic user    : {{ elastic_password }}
      kibana_system   : {{ kibana_system_password }}
      Agent policy    : {{ fleet_policy_name }} (system + Elastic Defend {{ edr_preset }} + full winlog)
      Detection rules : prepackaged rules installed + Windows rules enabled
      Fleet agents    : Management -> Fleet (windows agents enroll at :8220)
