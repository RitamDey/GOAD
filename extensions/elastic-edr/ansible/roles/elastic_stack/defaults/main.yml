# elastic-edr extension : stack role defaults
#
# Pin the elastic stack to an EXACT version (fully reproducible lab).
# Two variables:
#   elastic_repo_version  - the apt SUITE under artifacts.elastic.co/packages/.
#                           Only "8.x" exists as a suite; "8.19", "8.19.23" and
#                           every other per-minor/per-patch string are HTTP 404
#                           (curl-verified), so the repo line must use 8.x.
#   elastic_stack_version - the EXACT package version installed from that suite
#                           via apt's name==version syntax
#                           (elasticsearch=8.19.23, kibana=8.19.23). The 8.x
#                           suite carries every historical 8.y.z (verified in
#                           the suite's Packages index for both packages), so
#                           the exact-version pin survives the suite revert.
# Keep the version in sync with the two agent pins below / in elastic_agent_win
# (elastic_agent_version, elastic_agent_linux_version):
# Elastic requires ES >= Fleet Server >= Elastic Agent, and the integration
# packages in templates/kibana.yml are resolved against this same Kibana version.
# To upgrade: bump elastic_stack_version, the two agent versions, and the four
# integration package versions in templates/kibana.yml together.
elastic_repo_version: "8.x"
elastic_stack_version: "8.19.23"

# Elasticsearch java heap. Keep under half of the VM RAM (VM ships with 16GB).
elastic_heap: "6g"

# Known built-in user passwords (this is a lab, not production).
# One lab password for both users, aligned with the elk extension's
# stock-credential convention (elk runs ES 7.x with security off; 8.x mandates
# security, so we keep the stock elastic/changeme pair). Override via instance
# vars if you want different values - every consumer reads these variables.
elastic_password: "changeme"
kibana_system_password: "changeme"

# Endpoints
es_http_port: 9200
kibana_port: 5601

# Fleet
fleet_agent_policy_id: "goad-edr-policy"
fleet_policy_name: "GOAD-EDR-Policy"
enrollment_token_name: "goad-edr-enrollment"

# Dedicated Fleet Server (control plane on :8220) - BSL / LME / elastic-container
# pattern. It runs as the single elastic-agent on this VM, enrolled in the
# Fleet-Server-Policy (preconfigured in kibana.yml). Windows agents enroll at
# https://<vm>:8220 (self-signed cert auto-generated by the agent, agents pass
# --insecure) and ship events to Elasticsearch on 9200.
fleet_server_policy_id: "fleet-server-policy"
fleet_server_policy_name: "Fleet-Server-Policy"
fleet_server_enrollment_token_name: "goad-fleet-server-enrollment"
fleet_server_service_token_name: "goad-fleet-server"
fleet_server_port: 8220
# Linux agent used for the Fleet Server. Keep in sync with elastic_agent_win's
# elastic_agent_version (artifacts.elastic.co has no 8.x binary, exact patch).
elastic_agent_linux_version: "8.19.23"
elastic_agent_linux_url: "https://artifacts.elastic.co/downloads/beats/elastic-agent/elastic-agent-{{ elastic_agent_linux_version }}-linux-x86_64.tar.gz"

# Elastic Defend engine ("endpoint" integration) preset.
#   EDRComplete   - full EDR : detection + prevention (best, auto-degrades to
#                   Basic-license features such as memory/behavior prevention off)
#   DataCollection- detection only (no prevention)
#   Protection    - prevention only
edr_preset: "EDRComplete"

# Names of the package policies attached to the EDR agent policy via the API.
endpoint_policy_name: "goad-elastic-defend"
windows_policy_name: "goad-windows-sysmon"

# Prepackaged detection rules: enable after install?
#   true  = install + enable ALL prepackaged rules (out-of-the-box SIEM)
#   false = install only, rules stay DISABLED - solo hunting: attack, study
#           raw telemetry in Discover (logs-endpoint.events.*, sysmon,
#           logs-system.security-*), build your own alert rules in the UI
# State transitions apply on re-provision: on FIRST run the posture is
# applied per this flag; on later runs the bulk enable/disable runs only
# when this flag CHANGES vs the stored posture ({{ state_dir }}), so your
# per-rule enable/disable toggles from the Kibana UI survive re-provisions.
# Flipping the flag + re-provisioning converts either direction:
#   true after a solo-hunting install -> enables all prepackaged rules
#   false after an enabled install    -> disables all prepackaged rules
# Per-rule toggles are always available in the Kibana UI between provisions.
prepackaged_rules_enabled: true

# State directory where credentials / tokens are persisted for re-runs and for
# the windows agent play to read the enrollment token.
state_dir: /etc/elastic-edr
