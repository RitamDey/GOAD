# elastic-edr extension : applocker role
# Audit-only AppLocker policy (alert-only, nothing blocked) feeding the
# windows.applocker_* data streams. See defaults/main.yml + the policy XML
# header for the full rationale.

- name: Ensure AppLocker install directory exists
  ansible.windows.win_file:
    path: "{{ applocker_install_location }}"
    state: directory

- name: Render the AppLocker audit policy for the selected collection profile
  ansible.windows.win_template:
    src: "{{ role_path }}/files/{{ applocker_policy_file }}"
    dest: "{{ applocker_install_location }}\\{{ applocker_policy_file }}"
  register: applocker_policy_copy

# Validate the policy's collection types, rule identifiers and audit-only
# posture before asking Windows to import it.
- name: Validate the shipped AppLocker XML before applying it
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    try {
      [xml]$policy = Get-Content -LiteralPath "{{ applocker_install_location }}\{{ applocker_policy_file }}" -Raw
      if ($policy.AppLockerPolicy.Version -ne '1') { throw 'Expected AppLockerPolicy Version=1.' }
      $expectDll = "{{ applocker_enable_dll_collection | default(false) | string | lower }}" -eq 'true'
      $requiredTypes = @('Exe', 'Msi', 'Script', 'Appx')
      if ($expectDll) { $requiredTypes += 'Dll' }
      foreach ($type in $requiredTypes) {
        $collections = @($policy.AppLockerPolicy.RuleCollection | Where-Object { $_.Type -eq $type })
        if ($collections.Count -ne 1) { throw "Expected exactly one $type RuleCollection." }
        if ($collections[0].EnforcementMode -ne 'AuditOnly') { throw "$type collection is not AuditOnly." }
      }
      if (-not $expectDll -and @($policy.AppLockerPolicy.RuleCollection | Where-Object { $_.Type -eq 'Dll' }).Count -gt 0) {
        throw 'DLL collection was rendered although applocker_enable_dll_collection is false.'
      }
      if ($policy.SelectNodes('//RuleCollection[@Type="Msi"]/FilePathRule/Conditions/FilePublisherCondition').Count -gt 0) {
        throw 'FilePublisherCondition must be nested under FilePublisherRule.'
      }
      if ($policy.SelectNodes('//PackagedAppRule').Count -gt 0) {
        throw 'Packaged apps must use the Appx collection and FilePublisherRule representation.'
      }
      $rules = @($policy.SelectNodes('/AppLockerPolicy/RuleCollection/*'))
      if ($rules.Count -eq 0) { throw 'The policy contains no rules.' }
      $ids = @()
      foreach ($rule in $rules) {
        $id = $rule.GetAttribute('Id')
        if ([string]::IsNullOrWhiteSpace($id)) { throw "Rule '$($rule.Name)' has no Id." }
        $normalized = $id.Trim('{}')
        [void][guid]::Parse($normalized)
        $ids += $normalized.ToLowerInvariant()
      }
      if (@($ids | Select-Object -Unique).Count -ne $ids.Count) { throw 'The policy contains duplicate rule IDs.' }
      Write-Output ("AppLocker XML structure valid; required collections AuditOnly; DLL collection expected=" + $expectDll + ".")
    } catch {
      Write-Error "AppLocker policy validation failed: $($_.Exception.Message)"
      exit 1
    }
  register: applocker_xml_validate
  changed_when: false
  failed_when: applocker_xml_validate.rc is defined and applocker_xml_validate.rc != 0

# Startup mode alone does not start a stopped service. Start it explicitly and
# fail visibly before policy application if the service cannot reach Started.
- name: Configure and start AppIDSvc for AppLocker eventing
  ansible.windows.win_service:
    name: AppIDSvc
    start_mode: auto
    state: started
  register: appidsvc_result
  failed_when: appidsvc_result.state is defined and appidsvc_result.state != 'started'
# Preserve channel enablement once so uninstall can restore the pre-extension
# state instead of leaving Event Viewer configuration changed.
- name: Preserve original AppLocker event-channel states for uninstall
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $statePath = 'C:\ProgramData\GOAD-Elastic-EDR\applocker-event-channel-backup.json'
    if (Test-Path -LiteralPath $statePath) {
      Write-Output 'Existing AppLocker event-channel snapshot preserved.'
      exit 0
    }
    $channels = @(
      'Microsoft-Windows-AppLocker/EXE and DLL',
      'Microsoft-Windows-AppLocker/MSI and Script',
      'Microsoft-Windows-AppLocker/Packaged app-Execution',
      'Microsoft-Windows-AppLocker/Packaged app-Deployment'
    )
    $snapshot = foreach ($channel in $channels) {
      $log = Get-WinEvent -ListLog $channel -ErrorAction SilentlyContinue
      if ($null -eq $log) { throw "Expected AppLocker event channel is unavailable: $channel" }
      [pscustomobject]@{ LogName = $channel; WasEnabled = [bool]$log.IsEnabled }
    }
    New-Item -ItemType Directory -Path (Split-Path -Parent $statePath) -Force | Out-Null
    ConvertTo-Json -InputObject @($snapshot) -Depth 5 |
      Set-Content -LiteralPath $statePath -Encoding UTF8
    Write-Output 'Saved original AppLocker event-channel states.'
  register: applocker_event_channel_backup
  changed_when: false
  failed_when: applocker_event_channel_backup.rc is defined and applocker_event_channel_backup.rc != 0

# The Fleet Windows policy already enables all four matching data streams;
# enable them locally too, or an enabled stream has nothing to read.
- name: Enable and verify all four AppLocker Windows Event Log channels
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $channels = @(
      'Microsoft-Windows-AppLocker/EXE and DLL',
      'Microsoft-Windows-AppLocker/MSI and Script',
      'Microsoft-Windows-AppLocker/Packaged app-Execution',
      'Microsoft-Windows-AppLocker/Packaged app-Deployment'
    )
    $changed = 0
    foreach ($channel in $channels) {
      $log = Get-WinEvent -ListLog $channel -ErrorAction SilentlyContinue
      if ($null -eq $log) { throw "Expected AppLocker event channel is unavailable: $channel" }
      if (-not $log.IsEnabled) {
        & wevtutil.exe sl "$channel" /e:true
        if ($LASTEXITCODE -ne 0) { throw "wevtutil could not enable AppLocker channel '$channel' (exit $LASTEXITCODE)." }
        $changed++
      }
      $verify = Get-WinEvent -ListLog $channel -ErrorAction SilentlyContinue
      if ($null -eq $verify -or -not $verify.IsEnabled) { throw "AppLocker channel did not become enabled: $channel" }
    }
    Write-Output ("applocker_channels_enabled={0}/{1}" -f $channels.Count, $channels.Count)
    Write-Output ("applocker_channels_changed={0}" -f $changed)
  register: applocker_event_channels
  changed_when: (applocker_event_channels.stdout | default('')) is search('applocker_channels_changed=[1-9]')
  failed_when: applocker_event_channels.rc is defined and applocker_event_channels.rc != 0


# Issue #7 (PASS 2): apply ONLY on effective-policy drift, not every provision.
#
# NORMALIZATION CAVEAT (honest static posture): the hash compare is
# serialization-sensitive - a cosmetic re-serialization between
# Get-AppLockerPolicy -Effective -Xml output and the shipped file may report
# drift and re-apply (idempotent by design; audit-only policy, nothing is
# blocked). XML canonical normalization is deliberately NOT attempted in this
# pass (high complexity, low lab value); effective-state comparison is left
# to live-run validation. A retrieval failure exits non-zero and FAILS the
# drift task explicitly - it can never silently force or skip an apply.
#
# First-run case: a fresh host's effective policy hash differs from the
# shipped file (or effective retrieval yields the default allow-all), so
# applocker_drift=1 and the apply runs. No-op re-run: hashes equal ->
# drift=0 -> apply SKIPPED (the Set-AppLockerPolicy command does not run).
# XML change: drift=1 -> apply runs once and the effective hash changes.
- name: Compute effective-policy drift before applying (issue #7)
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    try {
      function Get-EffectiveAppLockerHash {
        $p = Get-AppLockerPolicy -Effective -Xml
        if ([string]::IsNullOrWhiteSpace([string]$p)) { throw 'Effective AppLocker policy XML is empty.' }
        $sha = [System.Security.Cryptography.SHA256]::Create()
        [System.BitConverter]::ToString($sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes([string]$p))).Replace('-','')
      }
      function Get-FilePolicyHash {
        $p = Get-Content -LiteralPath "{{ applocker_install_location }}\{{ applocker_policy_file }}" -Raw
        if ([string]::IsNullOrWhiteSpace([string]$p)) { throw 'Shipped policy XML is empty.' }
        $sha = [System.Security.Cryptography.SHA256]::Create()
        [System.BitConverter]::ToString($sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes([string]$p))).Replace('-','')
      }
      $eff = Get-EffectiveAppLockerHash
      $want = Get-FilePolicyHash
      Write-Output ("applocker_drift={0}" -f [int]($eff -ne $want))
    } catch {
      Write-Error "AppLocker drift check failed: $($_.Exception.Message)"
      exit 1
    }
  register: applocker_drift
  changed_when: false
  failed_when: applocker_drift.rc is defined and applocker_drift.rc != 0

# Hash, apply, and hash again in one task so changed_when compares values
# produced by this invocation rather than referencing a future task result.
# Gated on the drift pre-check above: skipped entirely on a no-op re-run.
- name: Apply the AppLocker audit-only policy and detect effective changes
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    try {
      function Get-EffectiveAppLockerHash {
        $p = Get-AppLockerPolicy -Effective -Xml
        if ([string]::IsNullOrWhiteSpace([string]$p)) { throw 'Effective AppLocker policy XML is empty.' }
        $sha = [System.Security.Cryptography.SHA256]::Create()
        [System.BitConverter]::ToString($sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes([string]$p))).Replace('-','')
      }
      $before = Get-EffectiveAppLockerHash
      Set-AppLockerPolicy -XmlPolicy "{{ applocker_install_location }}\{{ applocker_policy_file }}"
      $after = Get-EffectiveAppLockerHash
      Write-Output ("applocker_policy_changed=" + [int]($before -ne $after))
    } catch {
      Write-Error "AppLocker policy application failed: $($_.Exception.Message)"
      exit 1
    }
  register: applocker_apply
  changed_when: (applocker_apply.stdout | default('')) is search('applocker_policy_changed=1')
  failed_when: applocker_apply.rc is defined and applocker_apply.rc != 0
  when: (applocker_drift.stdout | default('')) is search('applocker_drift=1')

- name: Verify the effective AppLocker collections are active in audit mode
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    try {
      [xml]$policy = Get-AppLockerPolicy -Effective -Xml
      $bad = @()
      $expectDll = "{{ applocker_enable_dll_collection | default(false) | string | lower }}" -eq 'true'
      $requiredTypes = @('Exe', 'Msi', 'Script', 'Appx')
      if ($expectDll) { $requiredTypes += 'Dll' }
      foreach ($type in $requiredTypes) {
        $collections = @($policy.AppLockerPolicy.RuleCollection | Where-Object { $_.Type -eq $type })
        if ($collections.Count -ne 1 -or $collections[0].EnforcementMode -ne 'AuditOnly') { $bad += $type }
      }
      if ($bad.Count -gt 0) { throw "Missing or non-AuditOnly collection(s): $($bad -join ', ')." }
      if ($policy.SelectNodes('//RuleCollection[@Type="Appx"]/FilePublisherRule').Count -lt 1) {
        throw 'The effective Appx collection has no FilePublisherRule.'
      }
      $dllState = if (@($policy.AppLockerPolicy.RuleCollection | Where-Object { $_.Type -eq 'Dll' }).Count -gt 0) { 'enabled' } else { 'disabled' }
      Write-Output ("Effective AppLocker required collections are AuditOnly; DLL collection=" + $dllState + ".")
    } catch {
      Write-Error "Effective AppLocker policy verification failed: $($_.Exception.Message)"
      exit 1
    }
  register: applocker_verify
  changed_when: false
  failed_when: applocker_verify.rc is defined and applocker_verify.rc != 0
