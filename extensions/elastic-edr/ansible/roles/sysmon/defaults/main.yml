# Sysmon settings
#
# The Sysmon binaries are bundled in files/Sysmon.zip (pinned Sysmon 14.14).
# 14.x is the last major line that still supports Windows Server 2016 (DC03);
# 15.x dropped pre-2019 OSes. Config is the SwiftOnSecurity sysmon-config v74
# (files/sysmonconfig-export.xml), the latest upstream release.
sysmon_install_location: "c:\\sysmon"
sysmon_download_file: Sysmon
file_ext: .zip

# Sysmon telemetry-volume profiles. Defaults keep collection conservative.
# high_signal = Event ID 3 needs both a listed process/path and listed port.
# broad       = all Event ID 3 network connections (higher volume).
sysmon_network_telemetry: high_signal
# filtered = inherited Microsoft/vendor/CDN/advertising DNS exclusions retained.
# broad    = remove those domain exclusions; keep preceding local/reverse-DNS noise.
sysmon_dns_telemetry: filtered
