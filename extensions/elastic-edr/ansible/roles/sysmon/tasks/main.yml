# Sysmon install (https://github.com/NVISOsecurity/ansible-sysmon)
- name: Create directory
  win_file:
    path: "{{ sysmon_install_location }}"
    state: directory

- name: Get sysmon zip
  win_copy:
    src: "{{ sysmon_download_file }}{{ file_ext }}"
    dest: "{{ sysmon_install_location }}/{{ sysmon_download_file }}{{ file_ext }}"

- name: Unzip sysmon
  win_unzip:
    src: "{{ sysmon_install_location }}/{{ sysmon_download_file }}{{ file_ext }}"
    dest: "{{ sysmon_install_location }}"

- name: Validate Sysmon telemetry profiles
  ansible.builtin.assert:
    that:
      - sysmon_network_telemetry | default('high_signal') in ['high_signal', 'broad']
      - sysmon_dns_telemetry | default('filtered') in ['filtered', 'broad']
    fail_msg: "Sysmon profiles must be network=high_signal|broad and dns=filtered|broad."

- name: Render Sysmon configuration for selected telemetry profiles
  win_template:
    src: "{{ role_path }}/files/sysmonconfig-export.xml"
    dest: c:\\sysmon\\sysmonconfig-export.xml
  register: sysmon_config_copy

# Determine whether Sysmon is installed. A missing service is expected on a
# fresh host, so preserve the result and choose the install/reload path below.
- name: Check whether the Sysmon service exists
  win_service:
    name: sysmon64
  register: sysmon_service
  failed_when: false

- name: Install Sysmon and apply its initial configuration
  win_command: "{{ sysmon_install_location }}\\sysmon64.exe -accepteula -i {{ sysmon_install_location }}\\sysmonconfig-export.xml"
  args:
    chdir: "{{ sysmon_install_location }}"
  when: not (sysmon_service.exists | default(false) | bool)

# win_copy reports changed only when the local source and endpoint config
# differ. Apply -c in that case so config edits reach already-installed hosts
# when the extension is re-provisioned, without emitting needless config
# change events on every idempotent run.
- name: Reload changed Sysmon configuration on existing installations
  win_command: "{{ sysmon_install_location }}\\sysmon64.exe -accepteula -c {{ sysmon_install_location }}\\sysmonconfig-export.xml"
  args:
    chdir: "{{ sysmon_install_location }}"
  register: sysmon_config_reload
  changed_when: sysmon_config_reload.rc == 0
  when:
    - sysmon_service.exists | default(false) | bool
    - sysmon_config_copy.changed | default(false) | bool
