# health_assertions : cross-host roll-up (play 3, runs once on the ELASTIC-EDR VM)
# Collects the endpoint_health_report fact that play 2 recorded on every
# windows agent and prints the one-screen per-endpoint table that the
# install.yml / verify_agents headers promise. Fails loudly when NO host
# reported at all (play 2 never ran or every host skipped) - silent absence
# must not look like success.

- name: Collect endpoint health reports from all agent hosts
  ansible.builtin.set_fact:
    endpoint_rollup: >-
      {{ hostvars | dict2items
         | selectattr('value.endpoint_health_report', 'defined')
         | map(attribute='key') | list }}

- name: Show the endpoint roll-up (per-host table)
  ansible.builtin.debug:
    msg: |
      ================== ENDPOINT ROLL-UP ==================
      {% for host in endpoint_rollup | default([]) %}
      {% set r = hostvars[host].endpoint_health_report %}
      {{ '%-14s' | format(host) }} agent={{ '%-8s' | format(r.agent_service | default('?')) }} healthy={{ '%-4s' | format(r.agent_healthy | default('?')) }} audit_4688={{ '%-6s' | format(r.audit_4688 | default('?')) }} scriptblock_4104={{ r.scriptblock_4104 | default('?') }} applocker_channels={{ r.applocker_channels | default('?') }} AppLocker_audit={{ r.applocker_policy | default('?') }} DLLs={{ r.applocker_dll_collection | default('?') }}
      {% endfor %}
      ======================================================
      legend: healthy=yes/NO - agent daemon self-report (state=2 HEALTHY via
      `elastic-agent status --output json`); audit_4688 /
      scriptblock_4104 = yes/CHECK - host-side logging state;
      applocker_channels = 4/4 or CHECK - local AppLocker Event Log channels;
      AppLocker_audit = yes/CHECK - effective policy is audit-only;
      DLLs = enabled/off/unknown - optional DLL collection posture;
      agent=installed/MISSING - the elastic-agent service.
      hosts reported: {{ endpoint_rollup | default([]) | length }}

- name: Count unhealthy endpoints (roll-up grade)
  ansible.builtin.set_fact:
    endpoint_rollup_unhealthy: >-
      {{ endpoint_rollup | default([])
         | map('extract', hostvars, ['endpoint_health_report'])
         | selectattr('agent_healthy', 'equalto', 'NO') | list | length }}

- name: Count hosts with AppLocker readiness gaps
  ansible.builtin.set_fact:
    endpoint_rollup_applocker_unready: >-
      {{ (endpoint_rollup | default([])
          | map('extract', hostvars, ['endpoint_health_report'])
          | rejectattr('applocker_channels', 'equalto', '4/4') | list | length)
         +
         (endpoint_rollup | default([])
          | map('extract', hostvars, ['endpoint_health_report'])
          | rejectattr('applocker_policy', 'equalto', 'yes') | list | length) }}

- name: Count hosts missing the agent service
  ansible.builtin.set_fact:
    endpoint_rollup_missing: >-
      {{ endpoint_rollup | default([])
         | map('extract', hostvars, ['endpoint_health_report'])
         | selectattr('agent_service', 'equalto', 'MISSING') | list | length }}

- name: Count hosts with unverified process-creation auditing (4688)
  ansible.builtin.set_fact:
    endpoint_rollup_4688_check: >-
      {{ endpoint_rollup | default([])
         | map('extract', hostvars, ['endpoint_health_report'])
         | selectattr('audit_4688', 'defined')
         | selectattr('audit_4688', 'equalto', 'CHECK') | list | length }}

- name: Count hosts with unverified PowerShell script-block logging (4104)
  ansible.builtin.set_fact:
    endpoint_rollup_4104_check: >-
      {{ endpoint_rollup | default([])
         | map('extract', hostvars, ['endpoint_health_report'])
         | selectattr('scriptblock_4104', 'defined')
         | selectattr('scriptblock_4104', 'equalto', 'CHECK') | list | length }}

- name: Fail if no endpoint reported a health result
  ansible.builtin.fail:
    msg: >-
      No endpoint reported an endpoint_health_report - the verify_agents
      stage (play 2) either never ran or every host failed before the
      record step. Nothing to roll up; re-run the windows agents play.
  when: (endpoint_rollup | default([])) | length == 0

- name: Warn about unhealthy endpoints (non-fatal, per design)
  ansible.builtin.debug:
    msg: >-
      {{ endpoint_rollup_unhealthy }} endpoint(s) not yet healthy,
      {{ endpoint_rollup_missing }} endpoint(s) missing the agent service,
      {{ endpoint_rollup_4688_check }} endpoint(s) with unverified 4688
      process-creation auditing (CHECK),
      {{ endpoint_rollup_4104_check }} endpoint(s) with unverified 4104
      script-block logging (CHECK), and
      {{ endpoint_rollup_applocker_unready | default(0) }} AppLocker readiness
      check(s) needing attention - see the table above; these checks do not
      block Windows execution or simulate attack activity.
  when:
    - (endpoint_rollup | default([])) | length > 0
    - (endpoint_rollup_unhealthy | default(0)) | int > 0 or (endpoint_rollup_missing | default(0)) | int > 0 or (endpoint_rollup_applocker_unready | default(0)) | int > 0 or (endpoint_rollup_4688_check | default(0)) | int > 0 or (endpoint_rollup_4104_check | default(0)) | int > 0
