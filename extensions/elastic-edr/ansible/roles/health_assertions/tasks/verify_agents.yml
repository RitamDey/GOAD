# health_assertions : endpoint verification (play 2, per windows agent)
# Runs on every elastic-edr agent AFTER sysmon/applocker/endpoint_logging/
# elastic_agent_win. Asserts, per host, that:
#   1. the Elastic Agent service exists and is running
#   2. the agent self-reports healthy (elastic-agent status)
#   3. the host-side logging settings actually took (4688 audit + 4104 keys)
# A single slow host does NOT fail the whole play: the checks use
# failed_when: false and every host records an endpoint_health_report fact.
# The cross-host roll-up table is printed at the end of the run by the
# 'aggregate' stage (install.yml play 3), which also fails loudly when no
# host reported healthy.

- name: Check the Elastic Agent service state
  ansible.windows.win_service:
    name: elastic-agent
  register: agent_service
  failed_when: false

# The retry loop tests its OWN registered result (agent_health_retry), so the
# until-condition can actually flip once the agent finishes booting - a
# vars-pinned attempt-#1 result can never flip and only burns the budget.
- name: Wait for the agent to report healthy (local retries)
  ansible.windows.win_shell: |
    & "C:\Program Files\Elastic\Agent\{{ elastic_agent_version }}\agent\elastic-agent.exe" status --output json
  register: agent_health_retry
  changed_when: false
  failed_when: false
  until: >-
    (agent_health_retry.stdout | default(''))
    is search('"health"\s*:\s*"healthy"')
  retries: 6
  delay: 10
  when: agent_service.exists | default(false)

- name: Verify host-side logging took effect (4688 audit + 4104 script block)
  ansible.windows.win_shell: |
    $audit = (auditpol /get /subcategory:"Process Creation") -join ' '
    $sb = (Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging' -ErrorAction SilentlyContinue).EnableScriptBlockLogging
    Write-Output ("audit_process_creation=" + ($audit -match 'Success'))
    Write-Output ("scriptblock_logging=" + [int]($sb -eq 1))
  register: logging_verify
  changed_when: false
  failed_when: false

- name: Verify AppLocker event channels and effective audit-only posture
  ansible.windows.win_shell: |
    $channels = @(
      'Microsoft-Windows-AppLocker/EXE and DLL',
      'Microsoft-Windows-AppLocker/MSI and Script',
      'Microsoft-Windows-AppLocker/Packaged app-Execution',
      'Microsoft-Windows-AppLocker/Packaged app-Deployment'
    )
    $enabledCount = 0
    foreach ($channel in $channels) {
      $log = Get-WinEvent -ListLog $channel -ErrorAction SilentlyContinue
      if ($null -ne $log -and $log.IsEnabled) { $enabledCount++ }
    }
    $policyOk = $false
    $dllState = 'unknown'
    try {
      [xml]$policy = Get-AppLockerPolicy -Effective -Xml
      $bad = @()
      foreach ($type in @('Exe', 'Msi', 'Script', 'Appx')) {
        $collections = @($policy.AppLockerPolicy.RuleCollection | Where-Object { $_.Type -eq $type })
        if ($collections.Count -ne 1 -or $collections[0].EnforcementMode -ne 'AuditOnly') { $bad += $type }
      }
      $dllCollections = @($policy.AppLockerPolicy.RuleCollection | Where-Object { $_.Type -eq 'Dll' })
      $dllState = if ($dllCollections.Count -gt 0 -and $dllCollections[0].EnforcementMode -eq 'AuditOnly') { 'enabled' } elseif ($dllCollections.Count -eq 0) { 'disabled' } else { 'not-audit-only' }
      if ("{{ applocker_enable_dll_collection | default(false) | string | lower }}" -eq 'true' -and $dllState -ne 'enabled') { $bad += 'Dll' }
      if ($dllState -eq 'not-audit-only') { $bad += 'Dll-mode' }
      $policyOk = $bad.Count -eq 0
    } catch { $policyOk = $false }
    Write-Output ("applocker_event_channels={0}/{1}" -f $enabledCount, $channels.Count)
    Write-Output ("applocker_policy_audit_only=" + [int]$policyOk)
    Write-Output ("applocker_dll_collection=" + $dllState)
  register: applocker_readiness
  changed_when: false
  failed_when: false

- name: Record endpoint health result
  ansible.builtin.set_fact:
    endpoint_health_report:
      agent_service: "{{ agent_service.exists | default(false) | bool | ternary('installed', 'MISSING') }}"
      agent_healthy: "{{ (agent_health_retry.stdout | default('')) is search('\"health\"\\s*:\\s*\"healthy\"') | bool | ternary('yes', 'NO') }}"
      audit_4688: "{{ (logging_verify.stdout | default('')) is search('audit_process_creation=True') | bool | ternary('yes', 'CHECK') }}"
      scriptblock_4104: "{{ (logging_verify.stdout | default('')) is search('scriptblock_logging=1') | bool | ternary('yes', 'CHECK') }}"
      applocker_channels: "{{ (applocker_readiness.stdout | default('')) is search('applocker_event_channels=4/4') | bool | ternary('4/4', 'CHECK') }}"
      applocker_policy: "{{ (applocker_readiness.stdout | default('')) is search('applocker_policy_audit_only=1') | bool | ternary('yes', 'CHECK') }}"
      applocker_dll_collection: "{{ (applocker_readiness.stdout | default('')) is search('applocker_dll_collection=enabled') | bool | ternary('enabled', 'off/unknown') }}"
  changed_when: false

- name: Warn if the agent service is missing on this host
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: the elastic-agent service was not found.
      The elastic_agent_win role install step may have failed on this host.
  when: not (agent_service.exists | default(false) | bool)
