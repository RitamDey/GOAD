# elastic-edr extension : windows agent role
# Installs the Elastic Agent on a Windows domain machine and enrolls it in the
# dedicated Fleet Server (https://<elastic-host>:8220, self-signed cert -> --insecure)
# using the enrollment token bound to the EDR policy, which carries the
# "endpoint" / Elastic Defend engine, the "system" package and the "windows"
# Sysmon / PowerShell / Defender / AppLocker integration. Expects vars:
#   elastic_host           - ansible_host of the elastic-edr machine
#   fleet_server_port      - Fleet Server port (8220, set in install.yml pre_tasks)
#   edr_enrollment_token   - Fleet enrollment token (base64)
# Sysmon is expected to be installed first (see the sysmon role).
#
# Uses the official MSI installer (msiexec). It runs `elastic-agent install`
# under the hood with INSTALLARGS = "--url=... --enrollment-token=... --insecure".
# The PowerShell stop-parsing token (--%) keeps INSTALLARGS verbatim.

- name: Check if Elastic Agent service is installed
  win_service:
    name: elastic-agent
  register: ea_service
  failed_when: false

- name: Create install folder
  win_file:
    path: "{{ elastic_agent_install_location }}"
    state: directory

- name: Download Elastic Agent MSI ({{ elastic_agent_version }})
  win_get_url:
    url: "{{ elastic_agent_download_url }}"
    dest: "{{ elastic_agent_install_location }}\\elastic-agent-{{ elastic_agent_version }}-windows-x86_64.msi"
  register: ea_download
  until: ea_download is succeeded
  retries: 3
  delay: 10
  when: not ea_service.exists
  no_log: false

- name: Install and enroll Elastic Agent into Fleet (MSI)
  win_shell: >-
    msiexec.exe /i "{{ elastic_agent_install_location }}\elastic-agent-{{ elastic_agent_version }}-windows-x86_64.msi"
    /qn /norestart
    /l*v "{{ elastic_agent_install_location }}\elastic-agent-install.log"
    INSTALLARGS="--url={{ elastic_agent_fleet_url }} --enrollment-token={{ edr_enrollment_token }} --insecure"
  when: not (ea_service.exists | default(false) | bool)
  register: ea_msi
  failed_when: false
  changed_when: ea_msi.rc in [0, 1641, 3010]
  # INSTALLARGS carries the enrollment token inline - suppress it from run
  # output (#33); rc/changed_when stay evaluated by the play.
  no_log: true

- name: Fail with installer details if Elastic Agent MSI failed
  ansible.builtin.fail:
    msg: >-
      Elastic Agent MSI failed with exit code {{ ea_msi.rc | default('unknown') }}.
      Inspect {{ elastic_agent_install_location }}\elastic-agent-install.log
      for Windows Installer details.
  when:
    - not (ea_service.exists | default(false) | bool)
    - ea_msi.rc not in [0, 1641, 3010]

- name: Ensure Elastic Agent service is running
  win_service:
    name: elastic-agent
    state: started
    start_mode: auto
  register: ea_service_started

# Resolve the installed elastic-agent.exe once (issue #10): the Windows MSI
# installs program files at C:\Program Files\Elastic\Agent* with the exe at
# the Agent dir ROOT - no version-nested \<version>\agent\ directory (that is
# the tar/zip layout). Sources (fetched this session):
#   https://www.elastic.co/docs/reference/fleet/installation-layout
#   https://www.elastic.co/docs/reference/fleet/install-agent-msi
- name: Resolve the installed elastic-agent.exe path
  win_shell: |
    $p = "C:\Program Files\Elastic\Agent\elastic-agent.exe"
    if (-not (Test-Path $p)) {
      $p = (Get-Item "C:\Program Files\Elastic\Agent\*\agent\elastic-agent.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
    }
    if ($p) { Write-Output $p } else { Write-Output "" }
  register: ea_agent_exe
  changed_when: false
  failed_when: false

- name: Show agent status
  win_shell: |
    & "{{ ea_agent_exe.stdout | default('C:\Program Files\Elastic\Agent\elastic-agent.exe') }}" status
  register: ea_status
  changed_when: false
  failed_when: ea_status.rc != 0
