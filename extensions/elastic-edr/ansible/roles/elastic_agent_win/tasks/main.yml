# elastic-edr extension : windows agent role
# Installs the Elastic Agent on a Windows domain machine and enrolls it in Fleet
# using the enrollment token (bound to the EDR policy, which carries the system
# package -> Endpoint Security). Expects vars:
#   elastic_host           - ansible_host of the elastic-edr machine
#   kibana_port            - Kibana / Fleet port (5601)
#   edr_enrollment_token   - Fleet enrollment token (base64)
# Sysmon is expected to be installed first (see the sysmon role).

- name: Check if Elastic Agent service is installed
  win_service:
    name: elastic-agent
  register: ea_service
  failed_when: false

- name: Create install folder
  win_file:
    path: "{{ elastic_agent_install_location }}"
    state: directory

- name: Download Elastic Agent ({{ elastic_agent_version }})
  win_get_url:
    url: "{{ elastic_agent_download_url }}"
    dest: "{{ elastic_agent_install_location }}\\elastic-agent.zip"
  register: ea_download
  until: ea_download is succeeded
  retries: 3
  delay: 10
  when: not ea_service.exists
  no_log: false

- name: Unzip Elastic Agent
  win_unzip:
    src: "{{ elastic_agent_install_location }}\\elastic-agent.zip"
    dest: "{{ elastic_agent_install_location }}"
  when: not ea_service.exists

- name: Install and enroll Elastic Agent into Fleet
  win_shell: |
    $ErrorActionPreference = 'Stop'
    $dir = Get-ChildItem -Path "C:\elastic-agent" -Directory -Filter "elastic-agent-*-windows-x86_64" | Select-Object -First 1
    if (-not $dir) { Write-Error "elastic agent folder not found"; exit 1 }
    $exe = Join-Path $dir.FullName "elastic-agent.exe"
    & $exe install --url=http://{{ elastic_host }}:{{ kibana_port }} --enrollment-token='{{ edr_enrollment_token }}' --non-interactive
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  when: not ea_service.exists

- name: Ensure Elastic Agent service is running
  win_service:
    name: elastic-agent
    state: started
    start_mode: auto

- name: Show agent status
  win_shell: |
    $dir = Get-ChildItem -Path "C:\elastic-agent" -Directory -Filter "elastic-agent-*-windows-x86_64" | Select-Object -First 1
    & (Join-Path $dir.FullName "elastic-agent.exe") status
  register: ea_status
  changed_when: false
  failed_when: false
