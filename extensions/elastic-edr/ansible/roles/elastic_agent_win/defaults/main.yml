# elastic-edr extension : windows agent role defaults
#
# Keep in sync with the stack version (elastic_stack's elastic_repo_version, "8.x").
# The agent download needs an EXACT patch (artifacts.elastic.co has no 8.x binary),
# so pin a released 8.19.x here. Update both together for a fully reproducible lab.
elastic_agent_version: "8.19.23"

# Official Windows install path is the MSI (see "Install Elastic Agent from an MSI
# package"). msiexec runs `elastic-agent install` under the hood using INSTALLARGS.
elastic_agent_download_url: "https://artifacts.elastic.co/downloads/beats/elastic-agent/elastic-agent-{{ elastic_agent_version }}-windows-x86_64.msi"
elastic_agent_install_location: "C:\\elastic-agent"

# Fleet control-plane URL (base) : the dedicated Fleet Server on this VM's :8220
# (BSL / LME / elastic-container pattern). The Fleet Server agent auto-generates a
# self-signed cert, so agents enroll with --insecure (see the tasks). Data (events)
# flows to Elasticsearch on 9200 via the policy's default output.
elastic_agent_fleet_url: "https://{{ elastic_host }}:{{ fleet_server_port | default(8220) }}"
